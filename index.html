<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>확대 사진 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one column, canvas-first play screen; setup list below */
:root {
  --bg: #edf0f4; --surface: #ffffff; --fg: #1b2230; --muted: #66707f;
  --line: #d3d9e2; --accent: #e4572e; --accent-fg: #ffffff; --ok: #1f8a5b; --bad: #c0392b;
  --display: 'Do Hyeon', 'Noto Sans KR', system-ui, sans-serif;
  --body: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121820; --surface: #1b232e; --fg: #eef1f5; --muted: #9aa5b4; --line: #2e3947;
  --accent: #ff6b3d; --accent-fg: #14100e; --ok: #4ccf8e; --bad: #ff7b6b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121820; --surface: #1b232e; --fg: #eef1f5; --muted: #9aa5b4; --line: #2e3947;
  --accent: #ff6b3d; --accent-fg: #14100e; --ok: #4ccf8e; --bad: #ff7b6b; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0 }
img { max-width: 100% }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.5;
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px }
h1 { font-family: var(--display); font-size: 2rem; margin: 0; letter-spacing: .01em; text-wrap: balance }
h2 { font-family: var(--display); font-size: 1.3rem; margin: 0 }
.sub { color: var(--muted); margin: 0; font-size: .95rem }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px }
button { font: inherit; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 10px; padding: 10px 16px; cursor: pointer; min-height: 44px }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
button:disabled { opacity: .45; cursor: default }
input[type=text], input[type=number] { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; background: var(--bg); color: var(--fg); min-height: 44px }
label { font-size: .85rem; color: var(--muted); display: grid; gap: 4px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.row > * { min-width: 0 }
.grow { flex: 1 1 160px }
.photo-list { display: grid; gap: 10px }
.photo-item { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px }
.photo-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; background: var(--bg) }
.photo-item .del { padding: 6px 10px; min-height: 36px; color: var(--muted) }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; border: 1px dashed var(--line); border-radius: 10px }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer }
.drop.over { border-color: var(--accent); color: var(--accent) }
.drop input { display: none }
.settings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.stage { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 14px; overflow: hidden; background: #0b0e13; border: 1px solid var(--line) }
.stage canvas { width: 100%; height: 100%; display: block }
.badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.6); color: #fff; font-family: var(--display); font-size: 1rem; padding: 4px 10px; border-radius: 999px }
.badge.right { left: auto; right: 10px }
.timer { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.15) }
.timer i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(var(--t, 1)) }
.timer.hot i { background: var(--bad) }
.count { position: absolute; right: 10px; bottom: 14px; font-family: var(--display); font-size: 2.6rem; color: #fff;
  text-shadow: 0 2px 10px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; line-height: 1 }
.count.hot { color: var(--accent) }
@media (prefers-reduced-motion: no-preference) {
  .stage.pulse { animation: pulse .18s ease-out }
  @keyframes pulse { 0% { transform: scale(1.03) } 100% { transform: scale(1) } }
  .count.hot { animation: beat .5s infinite alternate }
  @keyframes beat { from { transform: scale(1) } to { transform: scale(1.25) } }
}
select { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); color: var(--fg); min-height: 44px }
.steps { display: flex; gap: 2px }
.steps span { flex: 1; height: 8px; border-radius: 2px; background: var(--line); min-width: 0 }
.steps span.on { background: var(--accent) }
.hud { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums }
.msg { min-height: 1.5em; font-weight: 500 }
.msg.ok { color: var(--ok) } .msg.bad { color: var(--bad) }
.answer { font-family: var(--display); font-size: 1.6rem }
.result-list { display: grid; gap: 8px }
.result-item { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px }
.result-item img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px }
.pts { font-family: var(--display); font-size: 1.3rem; font-variant-numeric: tabular-nums }
.toggle { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); cursor: pointer }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent) }
.total { font-family: var(--display); font-size: 2.4rem; text-align: center; font-variant-numeric: tabular-nums }
@media (prefers-reduced-motion: no-preference) { .stage canvas { transition: opacity .2s } }
</style>
</head>
<body>
<main>
  <header>
    <h1>확대 사진 퀴즈</h1>
    <p class="sub">사진을 넣으면 아주 작은 부분부터 보여주고, 단계마다 조금씩 넓혀 갑니다. 빨리 맞힐수록 점수가 높아요.</p>
  </header>

  <!-- 준비 화면 -->
  <section id="setup" class="card">
    <h2>1. 사진 넣기</h2>
    <div class="drop" id="drop">
      <input type="file" id="file" accept="image/*" multiple>
      여기를 눌러 사진을 고르거나 끌어다 놓으세요 (여러 장 가능)
    </div>
    <div class="photo-list" id="list"></div>
    <div class="empty" id="empty">아직 사진이 없어요. 아래 예시 그림으로 바로 해볼 수도 있어요.</div>
    <div class="row">
      <button id="sample">예시 그림 넣기</button>
      <button id="clear">모두 지우기</button>
    </div>

    <h2>2. 설정</h2>
    <div class="settings">
      <label>단계 수 (마지막은 전체 사진)
        <input type="number" id="steps" min="3" max="60" value="8"></label>
      <label>시작 확대 배율
        <input type="number" id="zoom" min="2" max="80" value="30"></label>
      <label>드러나는 속도
        <select id="curve"><option value="2.6" selected>끝까지 버티기 (거의 안 보임)</option><option value="1.6">보통</option><option value="1">고르게</option></select></label>
    </div>
    <label class="toggle"><input type="checkbox" id="shuffle" checked> 사진 순서 섞기</label>
    <label class="toggle"><input type="checkbox" id="host" checked> 진행자 모드 (입력창 없이 버튼으로만 진행, 여럿이 소리 내어 맞힐 때)</label>
    <button class="primary" id="start" disabled>게임 시작</button>
  </section>

  <!-- 플레이 화면 -->
  <section id="play" class="card" hidden>
    <div class="hud">
      <span id="counter">1 / 1</span>
      <span>점수 <strong id="score">0</strong></span>
    </div>
    <div class="stage">
      <canvas id="cv" width="800" height="800"></canvas>
      <span class="badge" id="zoomBadge">×14</span>
      <span class="badge right" id="stepBadge">1단계</span>
      <div class="timer" id="timer" hidden><i></i></div>
      <span class="count" id="count" hidden>8</span>
    </div>
    <div class="steps" id="stepBar"></div>
    <div class="msg" id="msg"></div>
    <div id="guessBox" class="row">
      <input type="text" id="guess" class="grow" placeholder="정답을 입력하세요" autocomplete="off" enterkeyhint="done">
      <button class="primary" id="submit">제출</button>
    </div>
    <div class="row">
      <button id="more" class="grow">더 보기</button>
      <button id="hostOk" class="grow" hidden>맞혔어요!</button>
      <button id="reveal" class="grow">정답 공개</button>
      <button id="next" class="primary grow" hidden>다음 사진</button>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="result" class="card" hidden>
    <h2>결과</h2>
    <div class="total" id="total">0점</div>
    <div class="result-list" id="resultList"></div>
    <div class="row">
      <button class="primary grow" id="again">같은 사진으로 다시</button>
      <button class="grow" id="back">사진 바꾸기</button>
    </div>
  </section>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  let photos = [];        // {img, src, answer, hint}
  let order = [], cur = 0, step = 0, N = 6, Z0 = 14, score = 0, focal = {x: .5, y: .5}, solved = false, results = [];

  // ---------- setup ----------
  function renderList() {
    const list = $('list'); list.innerHTML = '';
    photos.forEach((p, i) => {
      const el = document.createElement('div'); el.className = 'photo-item';
      el.innerHTML = `<img alt=""><input type="text" placeholder="정답 (예: 고양이)" id="ans${i}" value=""><button class="del" aria-label="삭제">✕</button>`;
      el.querySelector('img').src = p.src;
      const inp = el.querySelector('input'); inp.value = p.answer;
      inp.addEventListener('input', () => p.answer = inp.value);
      el.querySelector('.del').addEventListener('click', () => { photos.splice(i, 1); renderList(); });
      list.appendChild(el);
    });
    $('empty').hidden = photos.length > 0;
    $('start').disabled = photos.length === 0;
  }
  function addFiles(files) {
    [...files].forEach(f => {
      if (!f.type.startsWith('image/')) return;
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => { photos.push({img, src: r.result, answer: f.name.replace(/\.[^.]+$/, '')}); renderList(); };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    });
  }
  const drop = $('drop');
  drop.addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
  $('clear').addEventListener('click', () => { photos = []; renderList(); });

  // 예시 그림: 캔버스로 그린 간단한 풍경
  $('sample').addEventListener('click', () => {
    const c = document.createElement('canvas'); c.width = c.height = 600; const g = c.getContext('2d');
    const sky = g.createLinearGradient(0, 0, 0, 600); sky.addColorStop(0, '#7fb8ff'); sky.addColorStop(1, '#dff0ff');
    g.fillStyle = sky; g.fillRect(0, 0, 600, 600);
    g.fillStyle = '#ffd84d'; g.beginPath(); g.arc(480, 110, 55, 0, 7); g.fill();
    g.fillStyle = '#6fbf5a'; g.fillRect(0, 400, 600, 200);
    g.fillStyle = '#c9623a'; g.fillRect(160, 260, 220, 160);
    g.fillStyle = '#8b2f1c'; g.beginPath(); g.moveTo(130, 270); g.lineTo(270, 160); g.lineTo(410, 270); g.fill();
    g.fillStyle = '#4a2a1a'; g.fillRect(250, 330, 50, 90);
    g.fillStyle = '#bfe8ff'; g.fillRect(190, 290, 40, 40); g.fillRect(320, 290, 40, 40);
    g.fillStyle = '#5a3a1e'; g.fillRect(470, 300, 24, 120);
    g.fillStyle = '#2e8b3d'; g.beginPath(); g.arc(482, 270, 60, 0, 7); g.fill();
    g.fillStyle = '#fff'; [[80,120],[110,110],[140,125]].forEach(([x,y]) => { g.beginPath(); g.arc(x, y, 22, 0, 7); g.fill(); });
    const img = new Image(); img.onload = () => { photos.push({img, src: c.toDataURL(), answer: '집'}); renderList(); };
    img.src = c.toDataURL();
  });

  // ---------- play ----------
  const cv = $('cv'), ctx = cv.getContext('2d');
  function norm(s) { return (s || '').toLowerCase().replace(/[\s\-_.,!?'"~·]/g, ''); }
  let CURVE = 2.6, LIMIT = 8, timerId = null, deadline = 0;
  // k=0 → Z0, k=N-1 → 1. CURVE가 클수록 앞 단계에서 거의 안 넓어지고 막판에 확 열림
  function zoomAt(k) { const t = Math.pow(k / (N - 1), CURVE); return Math.pow(Z0, 1 - t); }

  function stopTimer() { if (timerId) cancelAnimationFrame(timerId); timerId = null; $('count').hidden = true; $('timer').style.setProperty('--t', 1); $('timer').classList.remove('hot'); }
  function startTimer() {
    stopTimer();
    if (!LIMIT) return;
    deadline = performance.now() + LIMIT * 1000;
    $('count').hidden = false;
    const tick = () => {
      const left = deadline - performance.now();
      if (left <= 0) { stopTimer(); timeUp(); return; }
      $('timer').style.setProperty('--t', left / (LIMIT * 1000));
      $('count').textContent = Math.ceil(left / 1000);
      const hot = left < 3000; $('count').classList.toggle('hot', hot); $('timer').classList.toggle('hot', hot);
      timerId = requestAnimationFrame(tick);
    };
    timerId = requestAnimationFrame(tick);
  }
  function timeUp() {
    if (solved) return;
    if (step < N - 1) advance(); else finishPhoto(false, 0);
  }
  function advance() {
    step++; draw(); $('msg').textContent = ''; $('msg').className = 'msg';
    const st = document.querySelector('.stage'); st.classList.remove('pulse'); void st.offsetWidth; st.classList.add('pulse');
    if (step === N - 1) { $('more').disabled = true; $('msg').textContent = '전체 사진입니다. 마지막 기회!'; }
    startTimer();
    if (!$('host').checked) $('guess').focus();
  }

  function draw() {
    const p = photos[order[cur]], img = p.img, z = zoomAt(step);
    const S = cv.width, iw = img.naturalWidth, ih = img.naturalHeight;
    const side = Math.min(iw, ih);                 // 정사각 기준으로 보이는 영역
    const w = Math.max(2, side / z), h = w;
    let sx = focal.x * iw - w / 2, sy = focal.y * ih - h / 2;
    sx = Math.min(Math.max(0, sx), iw - w); sy = Math.min(Math.max(0, sy), ih - h);
    ctx.imageSmoothingEnabled = z < 3;             // 크게 확대할 땐 픽셀을 그대로 보여 더 어렵게
    ctx.fillStyle = '#0b0e13'; ctx.fillRect(0, 0, S, S);
    if (step === N - 1) {                          // 마지막 단계: 전체 사진을 레터박스로
      const r = Math.min(S / iw, S / ih), dw = iw * r, dh = ih * r;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, 0, 0, iw, ih, (S - dw) / 2, (S - dh) / 2, dw, dh);
    } else {
      ctx.drawImage(img, sx, sy, w, h, 0, 0, S, S);
    }
    $('zoomBadge').textContent = step === N - 1 ? '전체' : '×' + z.toFixed(1);
    $('stepBadge').textContent = (step + 1) + '단계';
    const bar = $('stepBar'); bar.innerHTML = '';
    for (let i = 0; i < N; i++) { const s = document.createElement('span'); if (i <= step) s.className = 'on'; bar.appendChild(s); }
  }
  function pointsNow() { return Math.max(1, N - step); }

  function loadPhoto() {
    step = 0; solved = false;
    focal = {x: .2 + Math.random() * .6, y: .2 + Math.random() * .6};
    $('counter').textContent = (cur + 1) + ' / ' + order.length;
    $('msg').textContent = ''; $('msg').className = 'msg';
    $('guess').value = ''; $('guess').disabled = false; $('submit').disabled = false;
    $('more').hidden = false; $('reveal').hidden = false; $('next').hidden = true;
    $('hostOk').hidden = !$('host').checked; $('guessBox').hidden = $('host').checked;
    $('more').disabled = false;
    draw();
    startTimer();
    if (!$('host').checked) $('guess').focus();
  }
  function finishPhoto(ok, pts) {
    solved = true; stopTimer(); const p = photos[order[cur]];
    results.push({p, ok, pts, step});
    if (ok) { score += pts; $('score').textContent = score; }
    step = N - 1; draw();
    const m = $('msg'); m.className = 'msg ' + (ok ? 'ok' : 'bad');
    m.innerHTML = (ok ? `정답! +${pts}점 ` : '아쉽네요. ') + `정답은 <span class="answer">${escapeHtml(p.answer || '(정답 미입력)')}</span>`;
    $('guess').disabled = true; $('submit').disabled = true;
    $('more').hidden = true; $('reveal').hidden = true; $('hostOk').hidden = true; $('next').hidden = false;
    $('next').textContent = cur + 1 < order.length ? '다음 사진' : '결과 보기';
    $('next').focus();
  }
  function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  $('submit').addEventListener('click', submitGuess);
  $('guess').addEventListener('keydown', e => { if (e.key === 'Enter') submitGuess(); });
  function submitGuess() {
    if (solved) return;
    const g = norm($('guess').value), a = norm(photos[order[cur]].answer);
    if (!g) return;
    if (a && (g === a || (a.length >= 2 && g.includes(a)))) { finishPhoto(true, pointsNow()); return; }
    const m = $('msg'); m.className = 'msg bad'; m.textContent = '틀렸어요. 한 단계 더 넓혀 보세요.';
    $('guess').select();
  }
  $('more').addEventListener('click', () => { if (!solved && step < N - 1) advance(); });
  $('hostOk').addEventListener('click', () => { if (!solved) finishPhoto(true, pointsNow()); });
  $('reveal').addEventListener('click', () => { if (!solved) finishPhoto(false, 0); });
  $('next').addEventListener('click', () => {
    cur++;
    if (cur < order.length) loadPhoto(); else showResult();
  });

  function startGame() {
    N = Math.min(60, Math.max(3, +$('steps').value || 8));
    Z0 = Math.min(80, Math.max(2, +$('zoom').value || 30));
    LIMIT = 0;
    CURVE = +$('curve').value || 2.6;
    order = photos.map((_, i) => i);
    if ($('shuffle').checked) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    cur = 0; score = 0; results = []; $('score').textContent = '0';
    $('setup').hidden = true; $('result').hidden = true; $('play').hidden = false;
    loadPhoto();
    window.scrollTo({top: 0});
  }
  $('start').addEventListener('click', startGame);

  function showResult() {
    stopTimer(); $('play').hidden = true; $('result').hidden = false;
    const max = order.length * (N - 1);
    $('total').textContent = `${score}점 / ${max}점`;
    const rl = $('resultList'); rl.innerHTML = '';
    results.forEach(r => {
      const el = document.createElement('div'); el.className = 'result-item';
      el.innerHTML = `<img alt=""><div><div>${escapeHtml(r.p.answer || '(정답 미입력)')}</div><div class="sub">${r.ok ? (r.step + 1) + '단계에서 정답' : '못 맞힘'}</div></div><div class="pts">${r.ok ? '+' + r.pts : '0'}</div>`;
      el.querySelector('img').src = r.p.src;
      rl.appendChild(el);
    });
    window.scrollTo({top: 0});
  }
  $('again').addEventListener('click', startGame);
  $('back').addEventListener('click', () => { $('result').hidden = true; $('setup').hidden = false; renderList(); });

  renderList();
})();
</script>
</body>
</html>
