<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이상형 월드컵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--navy:#373282;--orange:#ED911A;--ink:#1b2230;--muted:#6b7280;--line:#e3e6ef;--bg:#f5f6fb;--a:#e8f1ff;--b:#fde8f1}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",sans-serif;line-height:1.5}
  button{font:inherit;cursor:pointer;border:0} .hidden{display:none!important}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);text-decoration:none}
  .pill{padding:6px 12px;border-radius:999px;background:#eef0fa;color:var(--navy);font-weight:700;font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
  h1,h2{margin:0 0 8px} .muted{color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:16px}
  .btn.orange{background:var(--orange)} .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)} .btn.sm{padding:8px 14px;font-size:14px} .btn:disabled{opacity:.4}
  /* setup */
  .setup{display:grid;grid-template-columns:1.2fr 1fr;gap:20px} @media(max-width:900px){.setup{grid-template-columns:1fr}}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;position:relative}
  .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .drop.over{border-color:var(--navy);background:#eef0fa}
  textarea{width:100%;min-height:120px;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;resize:vertical;margin-top:10px}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
  .item{position:relative;background:#f5f6fb;border-radius:12px;overflow:hidden;aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700}
  .item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .item .cap{position:relative;z-index:1;background:rgba(255,255,255,.85);border-radius:8px;padding:2px 8px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .del{position:absolute;top:4px;right:4px;z-index:2;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1}
  .item.text{font-size:16px;color:var(--navy)}
  .opts label{display:block;margin:8px 0}
  select,input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
  /* arena */
  .arena{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;min-height:62vh}
  .side{border-radius:24px;overflow:hidden;position:relative;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s;background:#fff;border:1px solid var(--line)}
  .side:hover{transform:scale(1.02);box-shadow:0 16px 40px rgba(55,50,130,.18)}
  .side img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111}
  .side.noimg{align-items:center;background:var(--a)} .side.noimg.b{background:var(--b)}
  .side .label{position:relative;z-index:1;margin:18px;padding:12px 22px;border-radius:16px;background:rgba(255,255,255,.92);font-size:clamp(22px,3vw,40px);font-weight:900;color:var(--navy);text-align:center;max-width:92%}
  .side.noimg .label{background:none;font-size:clamp(28px,4vw,56px);padding:0 20px}
  .side.win{outline:6px solid var(--orange);transform:scale(1.03)}
  .side.lose{opacity:.25;filter:grayscale(1)}
  .vs{display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:var(--orange);font-family:Impact,Pretendard,sans-serif}
  .round{text-align:center;margin-bottom:12px}
  .round .r{font-size:30px;font-weight:900;color:var(--navy)} .round .m{color:var(--muted);font-weight:700}
  .prog{height:8px;background:#eef0fa;border-radius:4px;overflow:hidden;margin:8px auto 0;max-width:500px}.prog b{display:block;height:100%;background:var(--orange)}
  .controls{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  /* result */
  .champ{text-align:center}
  .champ .img{width:min(60vw,420px);aspect-ratio:1;margin:12px auto;border-radius:28px;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center}
  .champ .img img{width:100%;height:100%;object-fit:contain}
  .champ .img.noimg{background:var(--a);font-size:48px;font-weight:900;color:var(--navy);padding:20px}
  .champ .name{font-size:clamp(32px,5vw,60px);font-weight:900;color:var(--navy)}
  .ranklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:16px}
  .ranklist .it{background:#f5f6fb;border-radius:12px;padding:10px;text-align:center;font-weight:700;font-size:14px}
  .ranklist .it img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:6px}
  .ranklist .it .stage{color:var(--orange);font-size:12px}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:-10px;width:10px;height:14px;animation:fall 3s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @media(max-width:700px){.arena{grid-template-columns:1fr;min-height:0}.side{min-height:36vh}.vs{font-size:28px}}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="../../">🏆 STEPI 랜덤 게임</a>
  <span class="pill">이상형 월드컵</span>
</div>
<div class="wrap">

<!-- 준비 -->
<section id="setup" class="setup">
  <div class="card">
    <h2>후보 넣기</h2>
    <div class="muted">사진을 올리거나 글만 적어도 돼요. 사진은 브라우저 안에서만 쓰이고 어디로도 올라가지 않습니다.</div>
    <div class="drop" id="drop" style="margin-top:12px">
      <input type="file" id="file" accept="image/*" multiple>
      📷 사진을 끌어다 놓거나 눌러서 선택 (여러 장 가능) — 파일 이름이 이름표가 돼요
    </div>
    <textarea id="names" placeholder="글로만 된 후보는 한 줄에 하나씩&#10;예) 점심은 짜장면&#10;점심은 짬뽕&#10;회식은 삼겹살"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <button class="btn sm ghost" id="add-text">글 후보 추가</button>
      <button class="btn sm ghost" id="sample">예시 넣기</button>
      <button class="btn sm ghost" id="clear">모두 지우기</button>
      <span class="muted" style="align-self:center" id="count"></span>
    </div>
    <div class="items" id="items"></div>
  </div>
  <div class="card">
    <h2>진행 방법</h2>
    <ol style="padding-left:20px;line-height:1.9">
      <li>후보를 8·16·32개 넣습니다 (부족하면 부전승으로 맞춰요).</li>
      <li>큰 화면에 두 후보가 나오면 참가자들이 <b>소리로</b> 고르고, 진행자가 이긴 쪽을 클릭합니다.</li>
      <li>결승까지 올라가 최종 1위를 가립니다.</li>
    </ol>
    <div class="opts">
      <label>대회 제목 <input type="text" id="title" placeholder="예: STEPI 점심 메뉴 월드컵" style="width:100%"></label>
      <label>강수 <select id="size"><option value="auto">자동 (후보 수에 맞춤)</option><option value="4">4강</option><option value="8">8강</option><option value="16">16강</option><option value="32">32강</option></select></label>
      <label><input type="checkbox" id="shuffle" checked> 대진 무작위 섞기</label>
      <label><input type="checkbox" id="confirm-click" checked> 클릭 후 1초 연출 (오클릭 방지)</label>
    </div>
    <button class="btn orange" id="start" style="width:100%;margin-top:12px;font-size:20px;padding:16px">월드컵 시작</button>
    <p class="muted" id="setup-msg" style="margin:8px 0 0"></p>
  </div>
</section>

<!-- 대결 -->
<section id="arena-sec" class="hidden">
  <div class="round"><div class="r" id="round-name">16강</div><div class="m" id="round-match">1 / 8 경기</div><div class="prog"><b id="prog"></b></div></div>
  <div class="arena">
    <div class="side" id="side-a"><div class="label" id="label-a"></div></div>
    <div class="vs">VS</div>
    <div class="side b" id="side-b"><div class="label" id="label-b"></div></div>
  </div>
  <div class="controls">
    <button class="btn ghost" id="undo">↩ 이전 경기로</button>
    <button class="btn ghost" id="quit">처음으로</button>
  </div>
</section>

<!-- 결과 -->
<section id="result" class="card champ hidden">
  <div class="muted" id="result-title">🏆 최종 우승</div>
  <div class="img" id="champ-img"></div>
  <div class="name" id="champ-name"></div>
  <div class="muted" style="margin-top:6px">2위: <b id="runner"></b></div>
  <div class="ranklist" id="ranklist"></div>
  <div class="controls">
    <button class="btn ghost" id="again">같은 후보로 다시</button>
    <button class="btn" id="newcup">새 월드컵</button>
  </div>
</section>
</div>
<div class="confetti" id="confetti"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let items = [];           // {id, name, src|null}
let bracket = [], roundIdx = 0, matchIdx = 0, history = [], eliminatedAt = {}, title = '';

// ---- 후보 입력 ----
function addFiles(files) {
  [...files].filter(f => f.type.startsWith('image/')).forEach(f => {
    const r = new FileReader();
    r.onload = e => { downscale(e.target.result, src => { items.push({ id: Date.now() + Math.random(), name: f.name.replace(/\.[^.]+$/, ''), src }); renderItems(); }); };
    r.readAsDataURL(f);
  });
}
function downscale(src, cb) {   // 큰 사진은 1200px 로 줄여 메모리 절약
  const img = new Image(); img.onload = () => {
    const s = Math.min(1, 1200 / Math.max(img.width, img.height)); if (s === 1) return cb(src);
    const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .85));
  }; img.src = src;
}
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
['dragenter', 'dragover'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => addFiles(e.dataTransfer.files));
$('add-text').onclick = () => {
  $('names').value.split('\n').map(s => s.trim()).filter(Boolean).forEach(n => items.push({ id: Date.now() + Math.random(), name: n, src: null }));
  $('names').value = ''; renderItems();
};
$('sample').onclick = () => { ['짜장면', '짬뽕', '삼겹살', '치킨', '피자', '떡볶이', '초밥', '김치찌개', '파스타', '햄버거', '냉면', '돈가스', '쌀국수', '마라탕', '곱창', '족발'].forEach(n => items.push({ id: Date.now() + Math.random(), name: n, src: null })); renderItems(); };
$('clear').onclick = () => { if (confirm('후보를 모두 지울까요?')) { items = []; renderItems(); } };
function renderItems() {
  $('items').innerHTML = items.map(it => `<div class="item ${it.src ? '' : 'text'}" data-id="${it.id}">${it.src ? `<img src="${it.src}" alt="">` : ''}<span class="cap" contenteditable="true" spellcheck="false">${esc(it.name)}</span><button class="del" title="삭제">×</button></div>`).join('');
  $('count').textContent = items.length ? `${items.length}개 후보` : '';
}
$('items').addEventListener('click', e => { if (e.target.classList.contains('del')) { const id = +e.target.closest('.item').dataset.id; items = items.filter(i => i.id !== id); renderItems(); } });
$('items').addEventListener('input', e => { if (e.target.classList.contains('cap')) { const it = items.find(i => i.id === +e.target.closest('.item').dataset.id); if (it) it.name = e.target.textContent.trim(); } });

// ---- 대진 ----
$('start').onclick = () => {
  if (items.length < 2) return $('setup-msg').textContent = '후보를 2개 이상 넣어 주세요.';
  title = $('title').value.trim() || '이상형 월드컵';
  let pool = items.slice(); if ($('shuffle').checked) pool.sort(() => Math.random() - .5);
  let size = $('size').value === 'auto' ? Math.pow(2, Math.ceil(Math.log2(pool.length))) : +$('size').value;
  if (size < pool.length) pool = pool.slice(0, size);
  while (pool.length < size) pool.push(null);   // 부전승 자리
  bracket = [pool]; roundIdx = 0; matchIdx = 0; history = []; eliminatedAt = {};
  show('arena-sec'); nextMatch();
};
const roundName = n => n === 2 ? '결승' : n === 4 ? '4강' : n + '강';
function cur() { const r = bracket[roundIdx]; return [r[matchIdx * 2], r[matchIdx * 2 + 1]]; }
function nextMatch() {
  const r = bracket[roundIdx];
  if (matchIdx * 2 >= r.length) {               // 라운드 끝
    if (r.length === 1) return finish(r[0]);
    const w = bracket[roundIdx + 1] || []; bracket[roundIdx + 1] = w;   // 이미 승자들이 push 되어 있음
    roundIdx++; matchIdx = 0; return nextMatch();
  }
  const [a, b] = cur();
  if (!a || !b) { bracket[roundIdx + 1] = bracket[roundIdx + 1] || []; bracket[roundIdx + 1].push(a || b); matchIdx++; return nextMatch(); }   // 부전승
  $('round-name').textContent = title + ' · ' + roundName(r.length);
  $('round-match').textContent = `${matchIdx + 1} / ${r.length / 2} 경기`;
  const done = bracket.slice(0, roundIdx).reduce((s, x) => s + x.length / 2, 0) + matchIdx, total = bracket[0].length - 1;
  $('prog').style.width = (done / total * 100) + '%';
  paint('a', a); paint('b', b);
  ['side-a', 'side-b'].forEach(id => $(id).classList.remove('win', 'lose'));
}
function paint(k, it) {
  const el = $('side-' + k); el.classList.toggle('noimg', !it.src);
  el.innerHTML = (it.src ? `<img src="${it.src}" alt="">` : '') + `<div class="label">${esc(it.name)}</div>`;
}
let locked = false;
function pick(k) {
  if (locked) return; locked = true;
  const [a, b] = cur(); const win = k === 'a' ? a : b, lose = k === 'a' ? b : a;
  $('side-' + k).classList.add('win'); $('side-' + (k === 'a' ? 'b' : 'a')).classList.add('lose');
  const go = () => {
    bracket[roundIdx + 1] = bracket[roundIdx + 1] || []; bracket[roundIdx + 1].push(win);
    eliminatedAt[lose.id] = roundName(bracket[roundIdx].length);
    history.push({ roundIdx, matchIdx, lose: lose.id });
    matchIdx++; locked = false; nextMatch();
  };
  $('confirm-click').checked ? setTimeout(go, 900) : go();
}
$('side-a').onclick = () => pick('a'); $('side-b').onclick = () => pick('b');
document.addEventListener('keydown', e => { if ($('arena-sec').classList.contains('hidden')) return; if (e.key === 'ArrowLeft') pick('a'); if (e.key === 'ArrowRight') pick('b'); });
$('undo').onclick = () => {
  const h = history.pop(); if (!h) return;
  // 되돌리기: 마지막 승자 제거, 그 경기로 복귀
  roundIdx = h.roundIdx; matchIdx = h.matchIdx;
  bracket[roundIdx + 1].pop(); delete eliminatedAt[h.lose];
  bracket.length = roundIdx + 2; locked = false; nextMatch();
};
$('quit').onclick = () => { if (confirm('처음 화면으로 돌아갈까요? (후보는 유지)')) show('setup'); };

// ---- 결과 ----
function finish(champ) {
  show('result');
  $('result-title').textContent = '🏆 ' + title + ' 최종 우승';
  $('champ-img').className = 'img' + (champ.src ? '' : ' noimg');
  $('champ-img').innerHTML = champ.src ? `<img src="${champ.src}" alt="">` : esc(champ.name);
  $('champ-name').textContent = champ.name;
  const runner = items.find(i => eliminatedAt[i.id] === '결승'); $('runner').textContent = runner ? runner.name : '-';
  const order = ['결승', '4강', '8강', '16강', '32강', '64강'];
  const rest = items.filter(i => i.id !== champ.id && eliminatedAt[i.id]).sort((x, y) => order.indexOf(eliminatedAt[x.id]) - order.indexOf(eliminatedAt[y.id]));
  $('ranklist').innerHTML = rest.map(i => `<div class="it">${i.src ? `<img src="${i.src}" alt="">` : ''}${esc(i.name)}<div class="stage">${eliminatedAt[i.id]} 탈락</div></div>`).join('');
  confetti();
}
$('again').onclick = () => { show('setup'); $('start').click(); };
$('newcup').onclick = () => { items = []; renderItems(); show('setup'); };
function show(id) { ['setup', 'arena-sec', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id)); window.scrollTo(0, 0); }
function confetti() {
  const c = $('confetti'); c.innerHTML = '';
  const colors = ['#373282', '#ED911A', '#1f8a5b', '#d6453d', '#f5c518', '#6c5ce7'];
  for (let i = 0; i < 100; i++) { const s = document.createElement('i'); s.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % 6]};animation-delay:${Math.random() * 1.5}s;transform:rotate(${Math.random() * 360}deg)`; c.appendChild(s); }
  setTimeout(() => c.innerHTML = '', 5000);
}
renderItems();
</script>
<script src="../../shared/home.js"></script>
</body>
</html>
