<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>꼬맨틀 — 진행자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../ox/ox.css">
<style>
  .grid{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card h2{margin:0 0 10px;font-size:18px}
  input[type=text],input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0}
  .stat{display:flex;gap:18px;flex-wrap:wrap}.stat b{font-size:28px;color:var(--navy);display:block;line-height:1.1}
  table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}td.n{text-align:right;font-variant-numeric:tabular-nums}
  #msg{min-height:1.5em;font-weight:700;margin-top:8px}#msg.ok{color:#1f8a5b}#msg.bad{color:#d6453d}
  .hint{font-size:13px;color:var(--muted);margin-top:6px}.hint code{background:#eef0fa;padding:1px 6px;border-radius:6px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips span{font-size:13px;padding:3px 10px;border-radius:999px;background:#eef0fa;color:var(--navy);cursor:pointer}
  .qrbox{text-align:center}.qrbox .url{font-size:12px;word-break:break-all;color:var(--muted)}
</style>
</head>
<body class="host">
<div class="topbar">
  <a class="brand" href="../../"><span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>STEPI 랜덤 게임</a>
  <span class="pill">🧠 꼬맨틀 · 진행자</span>
</div>
<div class="grid">
  <div style="display:grid;gap:16px">
    <div class="card">
      <h2>지금 진행 중</h2>
      <div class="stat">
        <div><b id="s-round">–</b><span class="muted">라운드</span></div>
        <div><b id="s-players">–</b><span class="muted">참가자</span></div>
        <div><b id="s-guesses">–</b><span class="muted">추측 수</span></div>
      </div>
      <div class="hint">정답은 진행자에게도 보이지 않아요. 누군가 맞히거나 새 라운드를 열면 참가자 화면에 공개됩니다.</div>
      <table style="margin-top:12px"><thead><tr><th>가장 가까운 추측</th><th>참가자</th><th class="n">유사도</th><th class="n">순위</th></tr></thead><tbody id="best"></tbody></table>
    </div>
    <div class="card">
      <h2>새 라운드 열기</h2>
      <input type="text" id="word" placeholder="정답 단어 (예: 연찬회, 부캉이, 세종시)" autocomplete="off" enterkeyhint="go">
      <div class="hint" id="check"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
        <button class="btn orange" id="start">이 단어로 새 라운드 시작</button>
        <button class="btn ghost" id="random">랜덤 정답으로 새 라운드</button>
      </div>
      <div id="msg"></div>
      <div class="hint">※ 새 라운드를 열면 지금 진행 중인 라운드는 끝나고 그 정답이 공개됩니다. 사전(약 12만 8천 단어)에 있는 단어만 정답이 될 수 있어요.</div>
      <input type="text" id="find" placeholder="단어 찾기 — 앞글자 (예: 연찬)" autocomplete="off" style="margin-top:10px">
      <div class="chips" id="found"></div>
    </div>
  </div>
  <div class="card qrbox">
    <h2>참가자 입장</h2>
    <div class="muted">휴대폰으로 QR을 찍으면 바로 참가 화면이 열려요</div>
    <div id="qr" style="display:flex;justify-content:center;margin:14px 0"></div>
    <div class="url" id="url"></div>
    <div class="hint">코드 입력은 없고, 접속한 사람 모두 같은 라운드에 참여합니다.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/supabase-config.js"></script>
<script src="../../shared/supabase-client.js"></script>
<script src="../../shared/pin.js"></script>
<script>
if (!window.sb) throw new Error('Supabase 설정 없음');
const $ = id => document.getElementById(id);
const msg = (t, cls) => { $('msg').textContent = t; $('msg').className = cls || ''; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let PIN = null;
STEPI_PIN.require().then(p => { PIN = p; });

const playUrl = location.href.replace(/host\.html.*$/, 'play.html');
new QRCode($('qr'), { text: playUrl, width: 220, height: 220, colorDark: '#373282' }); $('url').textContent = playUrl;

async function refresh() {
  const { data } = await sb.rpc('round_status');
  if (!data) { $('s-round').textContent = '없음'; $('s-players').textContent = $('s-guesses').textContent = '0'; $('best').innerHTML = ''; return; }
  $('s-round').textContent = data.id + '번째'; $('s-players').textContent = data.players; $('s-guesses').textContent = data.guesses;
  $('best').innerHTML = (data.best || []).map(b => `<tr><td>${esc(b.word)}</td><td>${esc(b.player)}</td><td class="n">${(b.similarity * 100).toFixed(2)}</td><td class="n">${b.rank == null ? '1000위 밖' : b.rank === 0 ? '정답' : b.rank + '위'}</td></tr>`).join('');
}
refresh(); setInterval(refresh, 4000);

let t = null;
$('word').oninput = () => {
  clearTimeout(t); const w = $('word').value.trim(); $('check').textContent = '';
  if (!w) return;
  t = setTimeout(async () => {
    const { data } = await sb.from('words').select('word').eq('word', w).maybeSingle();
    $('check').textContent = data ? '✅ 사전에 있는 단어예요' : '❌ 사전에 없는 단어예요 (아래 찾기로 비슷한 단어를 찾아보세요)';
  }, 300);
};
$('word').onkeydown = e => { if (e.key === 'Enter') $('start').click(); };

async function start(word) {
  if (!PIN) return;
  if (!confirm(word ? `"${word}" 를 정답으로 새 라운드를 열까요?\n(진행 중 라운드는 끝납니다)` : '랜덤 정답으로 새 라운드를 열까요?\n(진행 중 라운드는 끝납니다)')) return;
  $('start').disabled = $('random').disabled = true; msg('여는 중…');
  const { data, error } = await sb.rpc('start_round', { p_word: word || null, p_pin: PIN, p_player: '진행자' });
  $('start').disabled = $('random').disabled = false;
  if (error) { msg(error.message.replace(/^.*?: /, ''), 'bad'); if (/PIN/.test(error.message)) { STEPI_PIN.clear(); PIN = await STEPI_PIN.require(); } return; }
  msg(`${data}번째 라운드를 열었어요. 참가자 화면에 자동으로 안내됩니다.`, 'ok');
  $('word').value = ''; $('check').textContent = ''; refresh();
}
$('start').onclick = () => { const w = $('word').value.trim(); if (!w) return msg('단어를 입력하세요', 'bad'); start(w); };
$('random').onclick = () => start('');

let ft = null;
$('find').oninput = () => {
  clearTimeout(ft); const q = $('find').value.trim(); if (!q) return $('found').innerHTML = '';
  ft = setTimeout(async () => {
    const { data } = await sb.from('words').select('word').like('word', q + '%').limit(30);
    $('found').innerHTML = (data || []).map(r => `<span>${esc(r.word)}</span>`).join('') || '<span style="background:none;color:#999">없음</span>';
  }, 300);
};
$('found').onclick = e => { if (e.target.tagName === 'SPAN' && e.target.textContent !== '없음') { $('word').value = e.target.textContent; $('word').dispatchEvent(new Event('input')); } };
</script>
<script src="../../shared/home.js"></script>
</body>
</html>
