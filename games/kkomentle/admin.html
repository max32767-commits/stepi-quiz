<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>꼬멘틀 — 진행자 (정답 등록)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--navy:#373282;--orange:#ED911A;--ink:#1b2230;--muted:#6b7280;--line:#e3e6ef;--bg:#f5f6fb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",sans-serif;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px}
  h1{margin:0 0 4px;color:var(--navy);font-size:24px} h2{margin:0 0 10px;font-size:17px}
  .muted{color:var(--muted);font-size:14px}
  input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0}
  input:focus{outline:2px solid var(--navy)}
  .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px}
  .btn.orange{background:var(--orange)} .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .btn:disabled{opacity:.45}
  .status{display:flex;gap:16px;flex-wrap:wrap} .status b{font-size:22px;color:var(--navy);display:block}
  #msg{min-height:1.5em;font-weight:700;margin-top:8px}
  #msg.ok{color:#1f8a5b} #msg.bad{color:#d6453d}
  .hint{font-size:13px;color:var(--muted);margin-top:6px}
  .hint code{background:#eef0fa;padding:1px 6px;border-radius:6px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px} .chips span{font-size:13px;padding:3px 10px;border-radius:999px;background:#eef0fa;color:var(--navy);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🧠 꼬멘틀 진행자</h1>
    <div class="muted">정답 단어를 직접 정하거나 랜덤으로 새 라운드를 엽니다. 참가자는 <code>games/kkomentle/</code> 로 접속해요.</div>
  </div>

  <div class="card">
    <h2>지금 진행 중</h2>
    <div class="status">
      <div><b id="s-round">–</b><span class="muted">라운드</span></div>
      <div><b id="s-players">–</b><span class="muted">참가자</span></div>
      <div><b id="s-guesses">–</b><span class="muted">추측 수</span></div>
    </div>
    <div class="hint">정답은 여기서도 보이지 않아요. 라운드가 끝나면 참가자 화면에 공개됩니다.</div>
  </div>

  <div class="card">
    <h2>새 라운드 열기</h2>
    <input id="word" placeholder="정답 단어 (예: 연찬회, 과학, 세종)" autocomplete="off" enterkeyhint="go">
    <div class="hint" id="check"></div>
    <input id="pin" type="password" placeholder="PIN (설정했을 때만)" autocomplete="off" hidden>
    <button class="btn orange" id="start">이 단어로 새 라운드 시작</button>
    <button class="btn ghost" id="random">랜덤 정답으로 새 라운드</button>
    <div id="msg"></div>
    <div class="hint">※ 새 라운드를 열면 지금 진행 중인 라운드는 끝나고 정답이 공개됩니다.</div>
  </div>

  <div class="card">
    <h2>단어 찾기</h2>
    <div class="muted">사전(6만 8천 단어)에 있는 단어만 정답이 될 수 있어요. 앞글자를 넣으면 있는 단어를 보여줍니다.</div>
    <input id="find" placeholder="앞글자 (예: 연찬)" autocomplete="off">
    <div class="chips" id="found"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/supabase-config.js"></script>
<script src="../../shared/supabase-client.js"></script>
<script>
if (!window.sb) throw new Error('Supabase 설정 없음');
const $ = id => document.getElementById(id);
const msg = (t, cls) => { $('msg').textContent = t; $('msg').className = cls || ''; };

async function refresh() {
  const { data } = await sb.rpc('round_status');
  if (!data) { $('s-round').textContent = '없음'; $('s-players').textContent = $('s-guesses').textContent = '0'; return; }
  $('s-round').textContent = data.id + '번째'; $('s-players').textContent = data.players; $('s-guesses').textContent = data.guesses;
  $('pin').hidden = !data.has_pin;
}
refresh(); setInterval(refresh, 5000);

let t = null;
$('word').oninput = () => {
  clearTimeout(t); const w = $('word').value.trim(); $('check').textContent = '';
  if (!w) return;
  t = setTimeout(async () => {
    const { data } = await sb.from('words').select('word').eq('word', w).maybeSingle();
    $('check').textContent = data ? '✅ 사전에 있는 단어예요' : '❌ 사전에 없는 단어예요 (아래에서 비슷한 단어를 찾아보세요)';
  }, 300);
};
$('word').onkeydown = e => { if (e.key === 'Enter') $('start').click(); };

async function start(word) {
  if (word && !confirm(`"${word}" 를 정답으로 새 라운드를 열까요?\n(진행 중 라운드는 끝납니다)`)) return;
  if (!word && !confirm('랜덤 정답으로 새 라운드를 열까요?\n(진행 중 라운드는 끝납니다)')) return;
  $('start').disabled = $('random').disabled = true; msg('여는 중…');
  const { data, error } = await sb.rpc('start_round', { p_word: word || null, p_pin: $('pin').value || null, p_player: '진행자' });
  $('start').disabled = $('random').disabled = false;
  if (error) return msg(error.message.replace(/^.*?: /, ''), 'bad');
  msg(`${data}번째 라운드를 열었어요. 참가자 화면에서 "다음 라운드"를 누르면 시작됩니다.`, 'ok');
  $('word').value = ''; $('check').textContent = ''; refresh();
}
$('start').onclick = () => { const w = $('word').value.trim(); if (!w) return msg('단어를 입력하세요', 'bad'); start(w); };
$('random').onclick = () => start('');

let ft = null;
$('find').oninput = () => {
  clearTimeout(ft); const q = $('find').value.trim(); if (!q) return $('found').innerHTML = '';
  ft = setTimeout(async () => {
    const { data } = await sb.from('words').select('word').like('word', q + '%').limit(30);
    $('found').innerHTML = (data || []).map(r => `<span>${r.word}</span>`).join('') || '<span style="background:none;color:#999">없음</span>';
  }, 300);
};
$('found').onclick = e => { if (e.target.tagName === 'SPAN' && e.target.textContent !== '없음') { $('word').value = e.target.textContent; $('word').dispatchEvent(new Event('input')); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
</script>
<script src="../../shared/home.js"></script>
</body>
</html>
