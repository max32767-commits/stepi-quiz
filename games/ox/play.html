<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>스피드 퀴즈 — 참가</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="ox.css">
<style>
  .textpad{display:flex;flex-direction:column;gap:10px}
  .textpad input{font-size:24px;text-align:center;padding:18px}
  .tbar{height:10px;background:#eef0fa;border-radius:5px;overflow:hidden}.tbar b{display:block;height:100%;background:var(--navy);width:100%;transition:width .25s linear}
  .tbar.low b{background:var(--x)}
  .tleft{font-size:34px;font-weight:900;color:var(--navy);text-align:center;font-variant-numeric:tabular-nums}
  .tleft.low{color:var(--x)}
  .score{display:flex;justify-content:space-between;align-items:center;background:#fff1e0;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--orange)}
  .score b{font-size:22px}
  .feedback{text-align:center;font-size:22px;font-weight:900;min-height:1.5em}
  .feedback.ok{color:var(--o)}.feedback.bad{color:var(--x)}
  .oxpad{min-height:40vh}
</style>
</head>
<body>
<div class="play">
  <div class="topbar" style="border-radius:14px;border:1px solid var(--line)">
    <a class="brand" href="../../"><span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>STEPI</a>
    <span class="pill">⚡ 스피드 퀴즈</span>
  </div>

  <!-- 입장 -->
  <section id="join" class="card">
    <h2>참가하기</h2>
    <p class="muted">큰 화면에 보이는 4자리 코드와 이름을 넣으세요.</p>
    <input class="code" id="code" inputmode="numeric" maxlength="4" placeholder="0000" style="margin-bottom:10px">
    <input id="name" maxlength="12" placeholder="이름 (예: 홍길동)" style="margin-bottom:14px" enterkeyhint="go">
    <button class="btn orange" id="go">입장</button>
    <p class="muted" id="join-msg" style="margin:10px 0 0"></p>
  </section>

  <!-- 대기 -->
  <section id="wait" class="card hidden" style="text-align:center;padding:40px 20px">
    <div style="font-size:52px">🙋</div>
    <h2 id="wait-name"></h2>
    <p class="muted">입장했어요! 진행자가 시작할 때까지 기다려 주세요.</p>
    <p class="muted">문제가 나오면 <b>빨리 맞힐수록 점수가 높아요.</b> 틀려도 시간 안에 다시 시도할 수 있어요.</p>
  </section>

  <!-- 문제 -->
  <section id="q" class="hidden" style="display:flex;flex-direction:column;gap:12px;flex:1">
    <div class="score"><span>내 점수</span><b id="my-score">0</b></div>
    <div class="card" style="padding:16px"><div class="muted" id="q-no" style="font-weight:700;color:var(--orange)"></div><div class="qtext" id="q-text"></div></div>
    <div class="tleft" id="tleft"></div>
    <div class="tbar" id="tbar"><b id="tfill"></b></div>
    <div class="oxpad hidden" id="pad-ox">
      <button class="o" id="pick-o">O</button>
      <button class="x" id="pick-x">X</button>
    </div>
    <div class="textpad hidden" id="pad-text">
      <input id="text-in" placeholder="답을 입력하세요" autocomplete="off" enterkeyhint="send">
      <button class="btn orange" id="text-go">제출</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="status" id="q-status" style="padding:8px;font-size:18px"></div>
  </section>

  <!-- 결과 -->
  <section id="r" class="card hidden" style="text-align:center;padding:36px 20px">
    <div style="font-size:60px" id="r-icon"></div>
    <div class="status" id="r-text" style="padding:10px"></div>
    <p class="muted" id="r-sub"></p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../shared/supabase-config.js"></script>
<script src="../../shared/supabase-client.js"></script>
<script>
if (!window.sb) throw new Error('Supabase 설정 없음');
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
let code = (qs.get('room') || '').replace(/\D/g, '').slice(0, 4), me = null, room = null, lastQ = -1, solved = null, tick = null, busy = false;
$('code').value = code;
try { $('name').value = localStorage.getItem('ox:name') || ''; } catch (e) {}
if (code) $('name').focus(); else $('code').focus();
$('name').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };

// ---- 입장 ----
$('go').onclick = async () => {
  code = $('code').value.replace(/\D/g, '');
  const name = $('name').value.trim().slice(0, 12);
  if (code.length !== 4) return $('join-msg').textContent = '코드 4자리를 입력하세요.';
  if (!name) return $('join-msg').textContent = '이름을 입력하세요. (예: 홍길동)';
  $('go').disabled = true; $('join-msg').textContent = '입장 중…';
  let pid = null; try { pid = localStorage.getItem('ox:pid:' + code); } catch (e) {}
  const { data: p, error } = await sb.rpc('ox_join', { p_code: code, p_name: name, p_pid: pid ? +pid : null });
  if (error) { $('go').disabled = false; return $('join-msg').textContent = error.message.replace(/^.*?: /, ''); }
  me = p;
  try { localStorage.setItem('ox:name', name); localStorage.setItem('ox:pid:' + code, me.id); } catch (e) {}
  const { data: r } = await sb.from('ox_rooms').select('*').eq('code', code).maybeSingle();
  room = r; $('wait-name').textContent = name + ' 님';
  subscribe(); applyRoom();
};

// ---- 실시간 ----
function subscribe() {
  sb.channel('speed-play-' + code + '-' + me.id)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'ox_rooms', filter: 'code=eq.' + code }, p => { room = p.new; applyRoom(); })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'ox_players', filter: 'id=eq.' + me.id }, p => { me = p.new; $('my-score').textContent = me.score; })
    .subscribe();
  setInterval(async () => {
    const { data: r } = await sb.from('ox_rooms').select('*').eq('code', code).maybeSingle();
    const { data: p } = await sb.from('ox_players').select('*').eq('id', me.id).maybeSingle();
    if (p) { me = p; $('my-score').textContent = me.score; }
    if (r && r.updated_at !== room?.updated_at) { room = r; applyRoom(); }
  }, 3000);
}

// ---- 화면 ----
function show(id) { ['join', 'wait', 'q', 'r'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }
function applyRoom() {
  if (!room) return;
  $('my-score').textContent = me.score || 0;
  if (room.phase === 'lobby') { show('wait'); lastQ = -1; return; }
  if (room.phase === 'end') {
    show('r'); $('r-icon').textContent = '🏁'; $('r-text').textContent = `최종 ${me.score}점`; $('r-text').className = 'status ok';
    $('r-sub').textContent = '순위는 큰 화면을 보세요!'; return;
  }
  show('q');
  const isOx = room.qtype === 'ox';
  if (room.q_index !== lastQ) { lastQ = room.q_index; solved = null; $('text-in').value = ''; $('feedback').textContent = ''; $('feedback').className = 'feedback'; restore(); }
  $('pad-ox').classList.toggle('hidden', !isOx); $('pad-text').classList.toggle('hidden', isOx);
  $('q-no').textContent = 'Q' + (room.q_index + 1) + (isOx ? ' · O/X' : ' · 답을 적으세요');
  $('q-text').textContent = room.question || '';
  const revealed = room.phase === 'reveal';
  setInputs(revealed || !!solved);
  if (revealed) {
    clearInterval(tick); $('tleft').textContent = '⏱ 종료'; $('tfill').style.width = '0%';
    $('q-status').textContent = `정답은 "${room.answer}"` + (solved ? ` — +${solved.points}점 획득!` : ' — 다음 문제에서 만회해요');
    $('q-status').className = 'status ' + (solved ? 'ok' : 'bad');
  } else {
    $('q-status').textContent = solved ? '정답! 다음 문제를 기다리세요' : (isOx ? 'O 또는 X를 고르세요' : '빨리 답을 적고 제출하세요');
    $('q-status').className = 'status';
    startTimer();
  }
}
function setInputs(off) { ['pick-o', 'pick-x', 'text-in', 'text-go'].forEach(i => $(i).disabled = off); if (!off && room.qtype !== 'ox') $('text-in').focus(); }
function startTimer() {
  clearInterval(tick);
  const start = new Date(room.q_started_at).getTime(), limit = (room.time_limit || 30) * 1000;
  const upd = () => {
    const left = Math.max(0, limit - (Date.now() - start)) / 1000;
    $('tleft').textContent = Math.ceil(left) + '초'; $('tfill').style.width = (left / (limit / 1000) * 100) + '%';
    $('tbar').classList.toggle('low', left <= 5); $('tleft').classList.toggle('low', left <= 5);
    if (left <= 0) { clearInterval(tick); setInputs(true); if (!solved) $('q-status').textContent = '시간 종료! 정답 공개를 기다리세요'; }
  };
  upd(); tick = setInterval(upd, 250);
}
async function restore() {
  const { data } = await sb.from('ox_answers').select('points,elapsed_ms').eq('room_code', code).eq('q_index', room.q_index).eq('player_id', me.id).eq('correct', true).maybeSingle();
  if (data) { solved = data; applyRoom(); }
}
async function submit(ans) {
  if (busy || solved || room.phase !== 'question') return;
  busy = true; setInputs(true);
  if (navigator.vibrate) navigator.vibrate(30);
  const { data, error } = await sb.rpc('ox_submit', { p_code: code, p_q_index: room.q_index, p_player_id: me.id, p_answer: ans });
  busy = false;
  if (error) { $('feedback').textContent = error.message.replace(/^.*?: /, ''); $('feedback').className = 'feedback bad'; setInputs(room.phase !== 'question'); return; }
  if (data.correct) {
    solved = data; me.score = data.score; $('my-score').textContent = data.score;
    $('feedback').textContent = `🎉 정답! +${data.points}점` + (data.rank ? ` (${data.rank}번째)` : ''); $('feedback').className = 'feedback ok';
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    applyRoom();
  } else {
    $('feedback').textContent = '❌ 틀렸어요, 다시!'; $('feedback').className = 'feedback bad';
    $('text-in').value = ''; setInputs(false);
  }
}
$('pick-o').onclick = () => submit('O');
$('pick-x').onclick = () => submit('X');
$('text-go').onclick = () => { const v = $('text-in').value.trim(); if (v) submit(v); };
$('text-in').onkeydown = e => { if (e.key === 'Enter') $('text-go').click(); };
</script>
</body>
</html>
