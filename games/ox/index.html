<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스피드 퀴즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="ox.css">
</head>
<body>
<div class="play" style="justify-content:center">
  <div class="card" style="text-align:center;padding:36px 24px">
    <div style="font-size:56px">⚡</div>
    <h1 style="color:var(--navy)">스피드 퀴즈</h1>
    <p class="muted">진행자가 큰 화면에 문제를 내면 참가자는 휴대폰으로 답을 적어요.<br>빨리 맞힐수록 높은 점수, 여러 문제 총점이 가장 높은 사람이 우승!</p>
    <a class="btn" href="host.html" style="margin-top:10px;text-decoration:none">🖥️ 진행자 화면 (PIN 필요)</a>
    <a class="btn orange" href="play.html" style="margin-top:10px;text-decoration:none">📱 참가하기 (휴대폰)</a>
  </div>
</div>
<script>
  // 휴대폰에서 방 코드와 함께 열렸으면 참가 화면으로 바로
  const q = new URLSearchParams(location.search);
  if (q.get('room')) location.replace('play.html?room=' + q.get('room'));
</script>
<script src="../../shared/home.js"></script>
</body>
</html>
