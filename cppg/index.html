<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#FF5E00">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22CPPG%20%EB%B0%98%EB%B3%B5%ED%95%99%EC%8A%B5%22%2C%22short_name%22%3A%22CPPG%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23FFFFFF%22%2C%22theme_color%22%3A%22%23FF5E00%22%7D"><title>CPPG 반복학습</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap">
<style>
/* Layout: 단일 컬럼 학습 앱. 상단 고정 헤더, 콘텐츠 최대 1080px. 중립 카드(22px) + 포인트는 버튼·강조 숫자에만. */
:root{
  --bg:#FFFFFF; --surface:#F7F7F5; --surface2:#EFEFEC; --fg:#15171C; --muted:#6B7280;
  --line:#E4E4E8; --accent:#FF5E00; --accent-fg:#FFFFFF; --sub:#FFE477;
  --ok:#1F9D55; --ok-bg:#E8F6EE; --bad:#D6453D; --bad-bg:#FBEAE9;
  --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171C; --surface:#1F2128; --surface2:#2A2D36; --fg:#F2F2F0; --muted:#9AA0AA;
  --line:#33363F; --accent:#FF7A2E; --accent-fg:#15171C; --sub:#6B5A12;
  --ok:#4CC27A; --ok-bg:#1C3328; --bad:#F0706A; --bad-bg:#3A2322; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15171C; --surface:#1F2128; --surface2:#2A2D36; --fg:#F2F2F0; --muted:#9AA0AA;
  --line:#33363F; --accent:#FF7A2E; --accent-fg:#15171C; --sub:#6B5A12;
  --ok:#4CC27A; --ok-bg:#1C3328; --bad:#F0706A; --bad-bg:#3A2322; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-block:24px 64px;padding-inline:24px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px;padding-inline:24px}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.brand small{font-weight:400;color:var(--muted);font-size:14px;margin-left:4px}
nav{display:flex;gap:8px;flex-wrap:wrap}
.pill{border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 16px;height:40px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;height:50px;padding:0 28px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line);font-weight:700}
.btn.sm{height:40px;padding:0 20px;font-size:14px}
h1{font-size:clamp(32px,5vw,48px);font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:24px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:18px;font-weight:700;margin:0}
.label{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:22px;padding:24px}
.grid{display:grid;gap:24px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:720px){.g3,.g2{grid-template-columns:1fr}.wrap{padding-inline:16px}header.top{padding-inline:16px}}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .num{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .num b{color:var(--accent)}
.stat .cap{font-size:14px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:24px;margin-top:48px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.subj{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:16px 0}
.subj+.subj{border-top:1px solid var(--line)}
.bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.bar i.ok{background:var(--ok)}
.chip{font-size:13px;border-radius:999px;padding:2px 10px;background:var(--surface2);color:var(--muted);font-weight:700;display:inline-block}
.chip.acc{background:var(--accent);color:var(--accent-fg)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:24px}
.timer.warn{color:var(--bad)}
.qtext{font-size:20px;font-weight:700;line-height:1.5;margin:16px 0 24px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:14px 18px;color:var(--fg);line-height:1.5;transition:transform .15s,box-shadow .15s}
.opt:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 38px rgba(20,20,30,.08)}
.opt .n{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-top:2px}
.opt.sel{border-color:var(--fg)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .n{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad .n{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.explain{margin-top:24px;padding:20px 24px;border-radius:22px;background:var(--bg)}
.explain .verdict{font-weight:800;font-size:18px;margin-bottom:8px}
.explain .verdict.ok{color:var(--ok)} .explain .verdict.bad{color:var(--bad)}
.navgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.navgrid button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:13px;font-variant-numeric:tabular-nums}
.navgrid button.done{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navgrid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.navgrid button.mark{box-shadow:inset 0 0 0 2px var(--sub)}
.res-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.res-table th,.res-table td{text-align:left;padding:12px 8px}
.res-table th{font-size:13px;color:var(--muted);font-weight:700}
.res-table tr+tr td{border-top:1px solid var(--line)}
.wrongitem{padding:20px 0}
.wrongitem+.wrongitem{border-top:1px solid var(--line)}
.wrongitem .q{font-weight:700;margin:6px 0}
.wrongitem .a{margin-top:6px}
input[type=number],input[type=date],select,textarea{font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg);color:var(--fg)}
textarea{width:100%;min-height:120px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
.fade{animation:fu .35s ease both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.bar i,.opt{animation:none;transition:none}}
.kbd{font-size:12px;color:var(--muted)}
.notice{font-size:14px;color:var(--muted);line-height:1.6}
.dday{font-weight:800;font-size:18px}
</style>

</head><body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="dot"></span>CPPG 반복학습 <small>개인정보관리사</small></div>
  <nav id="nav">
    <button class="pill" data-view="home">홈</button>
    <button class="pill" data-view="setup">학습 시작</button>
    <button class="pill" data-view="wrong">오답노트</button>
    <button class="pill" data-view="history">기록</button>
    <button class="pill" data-view="settings">설정</button>
  </nav>
</div></header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
// CPPG 예상문제 은행 — 2026.10 기준 (2026.9.11 시행 개정 개인정보 보호법 반영)
// 형식: [과목, 문제, [선택지5], 정답index, 해설, 태그]
window.CPPG_SUBJECTS = [
  { id: 1, name: "개인정보보호의 이해", n: 10 },
  { id: 2, name: "개인정보보호 제도", n: 20 },
  { id: 3, name: "개인정보 라이프사이클 관리", n: 25 },
  { id: 4, name: "개인정보의 보호조치", n: 30 },
  { id: 5, name: "개인정보 관리체계", n: 15 }
];
window.CPPG_QUESTIONS = [
// ───────────── 1과목 개인정보보호의 이해 ─────────────
[1,"「개인정보 보호법」상 개인정보의 정의에 대한 설명으로 옳지 않은 것은?",
["살아 있는 개인에 관한 정보여야 한다.","성명, 주민등록번호 및 영상 등을 통하여 개인을 알아볼 수 있는 정보를 포함한다.","해당 정보만으로는 알아볼 수 없어도 다른 정보와 쉽게 결합하여 알아볼 수 있는 정보도 포함된다.","사망한 사람에 관한 정보도 원칙적으로 개인정보에 해당한다.","가명처리된 가명정보도 개인정보에 포함된다."],
3,"법 제2조 제1호. 개인정보는 '살아 있는 개인'에 관한 정보이므로 사망자·법인·단체의 정보는 원칙적으로 개인정보가 아니다. 다만 사망자 정보가 유족 등 살아 있는 사람과 관련되면 그 사람의 개인정보가 될 수 있다.","정의"],
[1,"개인정보 여부를 판단할 때 '다른 정보와 쉽게 결합할 수 있는지'에 대하여 법이 합리적으로 고려하도록 명시한 요소는?",
["다른 정보의 입수 가능성 등 개인을 알아보는 데 소요되는 시간, 비용, 기술","정보주체의 동의 여부","개인정보처리자의 연간 매출액","해당 정보의 보유·이용 기간","해당 정보의 암호화 여부"],
0,"법 제2조 제1호 나목. '쉽게 결합할 수 있는지'는 다른 정보의 입수 가능성 등 개인을 알아보는 데 소요되는 시간, 비용, 기술 등을 합리적으로 고려해야 한다.","정의"],
[1,"가명정보와 익명정보에 대한 설명으로 옳지 않은 것은?",
["가명정보는 추가 정보의 사용·결합 없이는 특정 개인을 알아볼 수 없도록 처리한 정보이다.","가명정보는 개인정보에 해당하므로 「개인정보 보호법」이 적용된다.","익명정보는 시간·비용·기술 등을 합리적으로 고려할 때 더 이상 특정 개인을 알아볼 수 없는 정보로, 보호법이 적용되지 않는다.","가명정보는 통계작성, 과학적 연구, 공익적 기록보존 목적으로 정보주체 동의 없이 처리할 수 있다.","익명정보도 가명정보와 동일하게 제28조의2 이하의 가명정보 특례 규정이 적용된다."],
4,"익명정보는 법 제58조의2에 따라 보호법 적용 대상이 아니므로 가명정보 특례 규정 자체가 적용되지 않는다. 가명정보는 여전히 개인정보이며 제28조의2~제28조의7의 특례가 적용된다.","가명·익명"],
[1,"OECD 프라이버시 8원칙(1980)에 해당하지 않는 것은?",
["수집 제한의 원칙","목적 명확화의 원칙","안전보호의 원칙","개인 참가의 원칙","익명처리 우선의 원칙"],
4,"OECD 8원칙: 수집 제한, 정보 정확성(데이터 품질), 목적 명확화, 이용 제한, 안전보호, 공개, 개인 참가, 책임. '익명처리가 가능하면 익명처리, 어려우면 가명처리'는 우리 법 제3조 제7항의 원칙이다.","원칙"],
[1,"「개인정보 보호법」 제3조 개인정보 보호 원칙에 대한 설명으로 옳지 않은 것은?",
["처리 목적을 명확하게 하고 그 목적에 필요한 범위에서 최소한의 개인정보만을 적법하고 정당하게 수집하여야 한다.","처리 목적에 필요한 범위에서 개인정보의 정확성, 완전성 및 최신성이 보장되도록 하여야 한다.","익명처리가 가능한 경우에도 가명처리를 우선하여야 한다.","개인정보 처리방침 등 처리에 관한 사항을 공개하고 열람청구권 등 정보주체의 권리를 보장하여야 한다.","정보주체의 사생활 침해를 최소화하는 방법으로 개인정보를 처리하여야 한다."],
2,"제3조 제7항: 익명처리가 가능한 경우에는 익명에 의하여, 익명처리로 목적 달성이 어려운 경우에는 가명에 의하여 처리될 수 있도록 하여야 한다. 익명이 우선이다.","원칙"],
[1,"2020년 8월 5일 시행된 '데이터 3법' 개정의 내용으로 옳지 않은 것은?",
["가명정보 개념을 도입하고 통계작성·과학적 연구·공익적 기록보존 목적의 처리를 허용하였다.","개인정보 보호위원회를 국무총리 소속 중앙행정기관으로 격상하였다.","「정보통신망법」의 개인정보 보호 규정을 「개인정보 보호법」으로 이관하였다.","정보주체의 개인정보 전송요구권을 신설하였다.","가명정보 결합을 전문기관이 수행하도록 하는 제도를 도입하였다."],
3,"전송요구권(제35조의2)과 자동화된 결정에 대한 권리(제37조의2)는 2023년 3월 개정(2024.3.15 시행)에서 신설되었다. 데이터 3법은 가명정보, 보호위원회 격상, 정보통신망법 조항 이관, 결합전문기관 등이 핵심이다.","연혁"],
[1,"헌법재판소가 개인정보자기결정권의 헌법적 근거로 제시한 조항은?",
["헌법 제10조(인간의 존엄과 가치·행복추구권)와 제17조(사생활의 비밀과 자유)","헌법 제11조(평등권)","헌법 제21조(언론·출판의 자유)","헌법 제23조(재산권 보장)","헌법 제37조 제2항(기본권 제한)만을 근거로 한다."],
0,"헌재 2005.5.26. 99헌마513(지문날인 사건)은 개인정보자기결정권을 헌법 제10조와 제17조 등에서 도출되는 독자적 기본권으로 인정하였다.","개념"],
[1,"1890년 논문 'The Right to Privacy'에서 프라이버시를 '혼자 있을 권리(right to be let alone)'로 정의한 인물은?",
["워렌(Warren)과 브랜다이스(Brandeis)","앨런 웨스틴(Alan Westin)","앤 카보키언(Ann Cavoukian)","다니엘 솔로브(Daniel Solove)","루이스 헨킨(Louis Henkin)"],
0,"워렌과 브랜다이스가 1890년 하버드 로 리뷰에서 제시했다. 앨런 웨스틴은 1967년 'Privacy and Freedom'에서 정보 프라이버시(자기정보통제권) 개념을, 카보키언은 Privacy by Design을 제시했다.","개념"],
[1,"EU GDPR에 대한 설명으로 옳지 않은 것은?",
["2018년 5월 25일부터 시행되었다.","EU 역외에 소재한 기업이라도 EU 거주자에게 재화·서비스를 제공하거나 행태를 모니터링하면 적용될 수 있다.","중대한 위반 시 전 세계 연간 매출액의 4% 또는 2천만 유로 중 높은 금액까지 과징금을 부과할 수 있다.","개인정보 침해 인지 후 72시간 이내에 감독기관에 통지하여야 한다.","우리나라는 아직 EU로부터 GDPR 적정성 결정을 받지 못하였다."],
4,"우리나라는 2021년 12월 17일 EU 집행위원회로부터 적정성 결정을 획득하였다. 이에 따라 EU에서 한국으로의 개인정보 이전이 표준계약 등 추가 조치 없이 가능해졌다.","국제"],
[1,"「개인정보 보호법」 제4조에 규정된 정보주체의 권리에 해당하지 않는 것은?",
["개인정보의 처리에 관한 정보를 제공받을 권리","개인정보의 처리에 관한 동의 여부, 동의 범위 등을 선택하고 결정할 권리","개인정보의 열람(사본 발급 포함) 및 전송을 요구할 권리","개인정보의 처리 정지, 정정·삭제 및 파기를 요구할 권리","개인정보처리자의 영업을 양수할 권리"],
4,"제4조는 ①정보를 제공받을 권리 ②동의 여부·범위 선택·결정권 ③열람·전송요구권 ④처리정지·정정·삭제·파기 요구권 ⑤피해 구제받을 권리 ⑥완전히 자동화된 결정을 거부하거나 설명 등을 요구할 권리를 규정한다.","권리"],
[1,"다음 중 「개인정보 보호법」상 민감정보에 해당하지 않는 것은?",
["사상·신념에 관한 정보","노동조합·정당의 가입·탈퇴에 관한 정보","건강에 관한 정보","운전면허번호","인종이나 민족에 관한 정보"],
3,"운전면허번호는 고유식별정보(시행령 제19조)이다. 민감정보는 법 제23조(사상·신념, 노조·정당 가입·탈퇴, 정치적 견해, 건강, 성생활 등)와 시행령 제18조(유전정보, 범죄경력자료, 생체인식정보, 인종·민족 정보)로 정해진다.","민감정보"],
[1,"개인정보 생애주기(라이프사이클)의 일반적인 단계를 순서대로 바르게 나열한 것은?",
["수집 → 저장·관리 → 이용·제공 → 파기","수집 → 이용·제공 → 파기 → 저장·관리","저장·관리 → 수집 → 이용·제공 → 파기","수집 → 파기 → 이용·제공 → 저장·관리","이용·제공 → 수집 → 저장·관리 → 파기"],
0,"개인정보 라이프사이클은 수집 → 저장·관리(보유) → 이용·제공 → 파기 순으로 흐르며, 각 단계마다 법적 요건(동의·고지, 안전조치, 목적 범위, 지체 없는 파기)이 있다.","라이프사이클"],
[1,"앤 카보키언(Ann Cavoukian)의 Privacy by Design 7원칙에 대한 설명으로 옳지 않은 것은?",
["사후 대응이 아닌 사전 예방적(proactive) 조치를 원칙으로 한다.","별도의 조치 없이도 기본 설정(default)으로 프라이버시가 보호되어야 한다.","프라이버시 보호를 시스템 설계에 내재화(embedded)한다.","프라이버시와 기능을 상충 관계(zero-sum)로 보고 보안을 위해 프라이버시를 희생한다.","개인정보의 전 생애주기에 걸쳐 종단간(end-to-end) 보호를 제공한다."],
3,"PbD 7원칙의 네 번째는 '완전한 기능성 — 제로섬이 아닌 포지티브섬(positive-sum)'으로, 프라이버시와 보안·기능이 양립할 수 있다고 본다. 나머지는 가시성·투명성, 사용자 프라이버시 존중이다.","PbD"],
[1,"다음 사례 중 '목적 외 이용'에 해당하는 개인정보 침해 유형은?",
["동의 없이 회원의 주민등록번호를 수집한 경우","회원 탈퇴 후 보유기간이 지났음에도 개인정보를 파기하지 않은 경우","회원가입 시 수집한 연락처를 동의 없이 계열사 상품 홍보에 이용한 경우","접근권한 관리 미비로 해커에게 개인정보가 유출된 경우","정보주체의 열람 요구를 정당한 사유 없이 거절한 경우"],
2,"수집 목적(회원 관리)과 다른 목적(계열사 마케팅)으로 이용하는 것은 제18조 목적 외 이용 위반이다. 나머지는 각각 수집 위반, 파기 의무 위반, 안전조치 위반, 열람권 침해에 해당한다.","침해유형"],
[1,"「개인정보 보호법」상 '개인정보처리자'에 대한 설명으로 옳지 않은 것은?",
["업무를 목적으로 개인정보파일을 운용하는 자를 말한다.","스스로 처리하는 경우뿐 아니라 다른 사람을 통하여 처리하는 경우도 포함된다.","공공기관, 법인, 단체가 해당된다.","개인은 개인정보처리자가 될 수 없다.","개인정보파일은 개인정보를 쉽게 검색할 수 있도록 일정한 규칙에 따라 체계적으로 배열·구성한 집합물이다."],
3,"제2조 제5호: 개인정보처리자는 업무를 목적으로 개인정보파일을 운용하기 위하여 스스로 또는 다른 사람을 통하여 개인정보를 처리하는 '공공기관, 법인, 단체 및 개인'이다. 개인사업자 등 개인도 포함된다.","정의"],

[2,"개인정보 보호위원회의 구성에 대한 설명으로 옳지 않은 것은?",
["국무총리 소속의 중앙행정기관이다.","위원장 1명, 부위원장 1명을 포함한 9명의 위원으로 구성된다.","위원장과 부위원장은 정무직 공무원으로 임명한다.","위원의 임기는 2년이며 연임할 수 없다.","위원장은 국무회의에 출석하여 발언할 수 있다."],
3,"법 제7조의2~제7조의4. 위원의 임기는 3년이며 한 차례만 연임할 수 있다. 위원장·부위원장은 상임위원이고, 위원장은 국무회의 출석·발언권 및 소관 사무에 관한 국무총리에 대한 의안 제출 건의권을 가진다.","보호위원회"],
[2,"개인정보 보호 기본계획과 시행계획에 대한 설명으로 옳은 것은?",
["기본계획은 보호위원회가 3년마다 수립하고, 시행계획은 중앙행정기관의 장이 매년 작성한다.","기본계획은 5년마다 국무총리가 수립한다.","시행계획은 보호위원회가 3년마다 수립한다.","기본계획은 매년 수립하여 국회에 보고한다.","기본계획과 시행계획 모두 행정안전부장관이 수립한다."],
0,"법 제9조: 보호위원회는 관계 중앙행정기관의 장과 협의하여 3년마다 기본계획을 수립한다. 제10조: 중앙행정기관의 장은 기본계획에 따라 매년 시행계획을 작성하여 보호위원회에 제출한다.","보호위원회"],
[2,"개인정보 분쟁조정위원회와 분쟁조정 절차에 대한 설명으로 옳지 않은 것은?",
["위원장 1명을 포함한 30명 이내의 위원으로 구성된다.","분쟁조정 신청을 받은 날부터 60일 이내에 심사하여 조정안을 작성해야 하며, 부득이한 경우 기간을 연장할 수 있다.","조정안을 제시받은 당사자가 15일 이내에 수락 여부를 알리지 아니하면 조정을 거부한 것으로 본다.","조정이 성립된 경우 그 조정 내용은 재판상 화해와 동일한 효력을 갖는다.","공공기관뿐 아니라 모든 개인정보처리자는 특별한 사유가 없으면 분쟁조정에 응하여야 한다."],
2,"2023년 개정(2023.9.15 시행)으로 제47조 제3항이 변경되어, 15일 이내에 수락 여부를 알리지 아니하면 조정을 '수락한 것으로 본다'. 또한 분쟁조정 의무 참여 대상이 공공기관에서 모든 개인정보처리자로 확대되고 사실조사권이 신설되었다.","분쟁조정"],
[2,"집단분쟁조정에 대한 설명으로 옳지 않은 것은?",
["피해 또는 권리침해를 입은 정보주체의 수가 50명 이상이어야 한다(조정 신청자 제외).","피해의 중요한 쟁점이 사실상 또는 법률상 공통되어야 한다.","분쟁조정위원회는 집단분쟁조정 절차 개시를 14일 이상 공고하여야 한다.","분쟁조정위원회는 개인정보처리자에게 보상계획서 작성·제출을 권고할 수 있다.","집단분쟁조정은 정보주체 개인만 신청할 수 있고 소비자단체는 신청할 수 없다."],
4,"법 제49조·시행령 제52조~제53조. 국가·지방자치단체, 한국소비자원, 소비자단체 또는 개인정보처리자도 집단분쟁조정을 의뢰·신청할 수 있다. 50명 이상, 14일 이상 공고가 요건이다.","분쟁조정"],
[2,"개인정보 단체소송에 대한 설명으로 옳지 않은 것은?",
["집단분쟁조정을 거부하거나 그 결과를 수락하지 아니한 개인정보처리자를 상대로 제기할 수 있다.","소비자단체는 공정거래위원회에 등록되고 정회원 수 1천명 이상, 등록 후 3년 경과 요건을 갖추어야 한다.","비영리민간단체는 100명 이상의 정보주체로부터 요청을 받고, 상시 구성원 5천명 이상이어야 한다.","단체소송을 제기하려면 법원의 허가를 받아야 하며 변호사를 소송대리인으로 선임해야 한다.","단체소송을 통해 정보주체의 손해배상을 청구할 수 있다."],
4,"법 제51조·제53조·제54조. 단체소송의 청구 내용은 권리침해 행위의 '금지·중지'이며 손해배상은 청구할 수 없다. 변호사 강제주의와 법원 허가가 적용된다.","단체소송"],
[2,"「개인정보 보호법」상 손해배상책임에 대한 설명으로 옳지 않은 것은?",
["개인정보처리자는 고의 또는 과실이 없음을 입증하지 못하면 손해배상책임을 면할 수 없다.","고의 또는 중대한 과실로 개인정보가 분실·도난·유출·위조·변조·훼손된 경우 손해액의 3배를 넘지 않는 범위에서 배상액을 정할 수 있다.","정보주체는 손해액 입증 없이 300만원 이하의 범위에서 법정손해배상을 청구할 수 있다.","법정손해배상 청구는 사실심 변론 종결 전까지 일반 손해배상 청구로 변경할 수 있다.","법정손해배상에서도 개인정보처리자가 고의·과실 없음을 입증하면 책임을 면한다."],
1,"2023년 개정으로 제39조 제3항의 징벌적 손해배상 한도가 3배에서 '5배'로 상향되었다. 제39조의2 법정손해배상은 300만원 이하이다.","손해배상"],
[2,"「개인정보 보호법」 제64조의2 과징금에 대한 설명으로 옳지 않은 것은?",
["전체 매출액의 100분의 3을 초과하지 않는 범위에서 부과할 수 있다.","위반행위와 관련이 없는 매출액은 과징금 산정에서 제외한다.","매출액이 없거나 산정이 곤란한 경우 20억원을 초과하지 않는 범위에서 부과한다.","과징금은 개인정보 보호위원회가 부과한다.","과징금 상한은 위반행위 관련 매출액의 100분의 1이다."],
4,"2023년 개정으로 과징금 기준이 '위반행위 관련 매출액 3%'에서 '전체 매출액 3%(관련 없는 매출액 제외)'로 변경되었고 정보통신서비스 제공자 특례가 일반 규정으로 통합되었다.","과징금"],
[2,"2026년 9월 11일 시행된 개정 「개인정보 보호법」의 반복적·중대한 침해에 대한 과징금(제64조의2 제2항) 설명으로 옳지 않은 것은?",
["고의 또는 중대한 과실로 3년 이내에 반복적으로 위반한 경우 적용된다.","고의 또는 중대한 과실로 100만명 이상의 대규모 피해가 발생한 경우 적용된다.","시정조치 명령에 따르지 아니하여 유출등이 발생한 경우 적용된다.","전체 매출액의 100분의 10을 초과하지 않는 범위에서 과징금을 부과할 수 있다.","매출액이 없거나 산정이 곤란한 경우 50억원을 초과하지 않는 범위에서 부과한다."],
1,"대규모 피해 기준은 '1천만명 이상'이다. 개정법은 ①3년 이내 반복 위반 ②1천만명 이상 피해 ③시정명령 불이행 유출의 경우 전체 매출액 10%(산정 곤란 시 50억원) 이하의 징벌적 과징금을 도입했고, 보호 투자 등에 대한 감경 사유도 신설했다.","2026개정"],
[2,"2026년 개정 「개인정보 보호법」의 사업주·대표자 및 개인정보 보호책임자(CPO) 관련 내용으로 옳지 않은 것은?",
["사업주 또는 대표자는 개인정보 처리 및 보호의 최종 책임자로서 인력 관리·예산 확보 등 총괄적 관리 조치를 하여야 한다(제30조의3).","일정 기준에 해당하는 개인정보처리자는 CPO를 지정·변경·해제할 때 이사회 의결을 거쳐야 한다.","일정 기준에 해당하는 개인정보처리자는 CPO 지정 내용을 보호위원회에 신고하여야 한다.","CPO는 전문 인력 관리 및 예산 확보 권한을 갖고 주요 사항을 대표자 및 이사회에 보고하여야 한다.","CPO를 지정할 때에는 국회의 동의를 받아야 한다."],
4,"국회 동의 요건은 없다. 개정법은 대표자의 최종 책임 명확화, 일정 규모 처리자의 CPO 이사회 의결·보호위원회 신고, CPO의 인력·예산 권한 및 이사회 보고 의무를 신설했다.","2026개정"],
[2,"2026년 개정 「개인정보 보호법」에서 매출액·개인정보 처리 규모가 일정 기준 이상인 개인정보처리자에게 개인정보 보호 인증을 의무화한 규정(제32조의2)의 시행일은?",
["2026년 3월 10일","2026년 9월 11일","2027년 1월 1일","2027년 7월 1일","2028년 1월 1일"],
3,"개정법(2026.3.10 공포)은 원칙적으로 공포 후 6개월인 2026.9.11 시행되지만, 인증 의무화와 관련 과태료 규정은 예산 확보 등 준비기간을 고려하여 2027.7.1부터 시행된다.","2026개정"],
[2,"개인정보 영향평가 의무 대상 개인정보파일에 해당하지 않는 것은?",
["5만명 이상의 정보주체에 관한 민감정보 또는 고유식별정보의 처리가 수반되는 개인정보파일","공공기관 내부 또는 외부의 다른 개인정보파일과 연계한 결과 50만명 이상의 정보주체에 관한 개인정보가 포함되는 파일","100만명 이상의 정보주체에 관한 개인정보파일","10만명 이상의 정보주체에 관한 일반 개인정보파일","영향평가를 받은 후 개인정보 검색체계 등 운용체계를 변경하여 침해 위험요인이 변동된 파일"],
3,"시행령 제35조. 기준은 5만(민감·고유), 50만(연계), 100만(일반)이며 '10만명 이상 일반 파일'은 대상이 아니다. 10만명은 안전성 확보조치 기준의 재해·재난 대비 조치 기준과 혼동하기 쉽다.","영향평가"],
[2,"개인정보 영향평가에 대한 설명으로 옳지 않은 것은?",
["공공기관은 대상 개인정보파일의 운용으로 침해 우려가 있는 경우 영향평가를 하여야 한다.","민간기업도 영향평가가 법적 의무이다.","영향평가는 보호위원회가 지정하는 평가기관에 의뢰하여 수행한다.","공공기관은 영향평가 결과를 보호위원회에 제출하여야 한다.","평가 시 처리하는 개인정보의 수, 제3자 제공 여부, 정보주체 권리 침해 위험요소 등을 고려한다."],
1,"법 제33조. 공공기관은 의무, 공공기관 외 개인정보처리자는 영향평가를 하기 위하여 적극 노력하여야 한다(권고). 평가기관은 보호위원회가 지정하며 결과는 보호위원회에 제출한다.","영향평가"],
[2,"공공기관의 개인정보파일 등록에 대한 설명으로 옳지 않은 것은?",
["공공기관의 장은 개인정보파일을 운용하는 경우 보호위원회에 등록하여야 한다.","등록 사항에는 개인정보파일의 명칭, 운용 근거 및 목적, 기록되는 개인정보 항목, 보유기간 등이 포함된다.","국가 안전, 외교상 비밀 등에 관한 사항을 기록한 파일은 등록 대상에서 제외된다.","범죄의 수사, 공소의 제기 및 유지 등에 관한 사항을 기록한 파일은 등록 대상에서 제외된다.","민간기업도 보유하는 모든 개인정보파일을 보호위원회에 등록하여야 한다."],
4,"법 제32조의 개인정보파일 등록·공개 의무는 '공공기관'에만 적용된다. 공공기관 내부 업무처리만을 위한 파일, 영상정보처리기기로 처리되는 파일 등도 등록 제외 대상이다.","개인정보파일"],
[2,"개인정보 처리방침에 반드시 포함되어야 하는 사항(제30조 제1항)에 해당하지 않는 것은?",
["개인정보의 처리 목적","개인정보의 처리 및 보유 기간","개인정보의 파기절차 및 파기방법","개인정보 보호책임자의 주민등록번호","정보주체와 법정대리인의 권리·의무 및 그 행사방법"],
3,"처리방침에는 CPO의 성명 또는 개인정보 보호업무 및 관련 고충사항을 처리하는 부서의 명칭과 전화번호 등 연락처를 기재한다. 주민등록번호는 기재 대상이 아니며, 기재하면 오히려 법 위반이다.","처리방침"],
[2,"개인정보 처리방침에 대한 설명으로 옳지 않은 것은?",
["개인정보처리자는 처리방침을 정보주체가 쉽게 확인할 수 있도록 인터넷 홈페이지 등에 지속적으로 게재하여야 한다.","인터넷 홈페이지가 없는 경우 사업장 등의 보기 쉬운 장소에 게시하는 등의 방법으로 공개할 수 있다.","처리방침의 내용과 정보주체와 체결한 계약의 내용이 다른 경우 처리방침이 우선한다.","보호위원회는 처리방침의 적정성을 평가하고 개선을 권고할 수 있다(처리방침 평가제).","처리방침을 변경하는 경우에도 변경된 내용을 지속적으로 공개하여야 한다."],
2,"법 제30조 제3항: 처리방침 내용과 정보주체와 체결한 계약 내용이 다른 경우 '정보주체에게 유리한 것'을 적용한다. 처리방침 평가제는 2023년 개정으로 신설(제30조의2)되었다.","처리방침"],
[2,"일정 규모 이상의 개인정보처리자가 지정해야 하는 개인정보 보호책임자의 전문성 요건(2024.3.15 시행)으로 옳은 것은?",
["개인정보보호·정보보호·정보기술 경력을 합산하여 4년 이상이고, 그중 개인정보보호 경력이 2년 이상","정보보호 경력만 10년 이상","변호사 또는 정보관리기술사 자격 보유 필수","개인정보보호 경력 1년 이상","경력 요건 없이 임원이면 가능"],
0,"시행령 제32조 제4항. 대상은 연 매출액(수입) 1,500억원 이상이면서 100만명 이상(또는 민감·고유식별정보 5만명 이상)을 처리하는 자, 재학생 2만명 이상 대학, 상급종합병원, 대규모 공공시스템 운영기관 등이다.","CPO"],
[2,"국내대리인 지정 의무 대상에 대한 설명으로 옳지 않은 것은?",
["국내에 주소 또는 영업소가 없는 개인정보처리자가 대상이다.","전년도 전체 매출액이 1조원 이상인 자","정보통신서비스 부문 전년도 매출액이 100억원 이상인 자","전년도 말 기준 직전 3개월간 저장·관리되고 있는 국내 정보주체 수가 일일평균 100만명 이상인 자","국내에 영업소가 있는 사업자도 매출액 요건을 충족하면 국내대리인을 지정하여야 한다."],
4,"법 제31조의2·시행령 제32조의2. 국내대리인 제도는 국내에 주소나 영업소가 '없는' 자를 대상으로 하며, 보호위원회로부터 관계 물품·서류 제출을 요구받은 자도 포함된다.","국내대리인"],
[2,"「개인정보 보호법」 제58조 적용의 일부 제외에 대한 설명으로 옳지 않은 것은?",
["국가안전보장과 관련된 정보 분석을 목적으로 수집·제공 요청되는 개인정보에는 제3장~제8장이 적용되지 않는다.","언론, 종교단체, 정당이 각각 취재·보도, 선교, 선거 입후보자 추천 등 고유 목적을 달성하기 위하여 수집·이용하는 개인정보에는 제3장~제8장이 적용되지 않는다.","공공기관이 「통계법」에 따라 수집하는 개인정보는 현재도 적용 제외 대상으로 명시되어 있다.","개인정보처리자가 동창회, 동호회 등 친목 도모를 위한 단체를 운영하기 위하여 개인정보를 처리하는 경우 제15조, 제30조, 제31조가 적용되지 않는다.","적용이 제외되는 경우에도 개인정보처리자는 목적에 필요한 최소한의 기간·범위에서 처리하고 안전조치 등을 마련하여야 한다."],
2,"2023년 개정으로 제58조 제1항의 '통계법에 따라 수집되는 개인정보' 및 '공중위생 등 공공의 안전과 안녕을 위하여 긴급히 필요한 경우' 조항은 삭제되었다(후자는 제15조 제1항 제7호의 수집·이용 근거로 이동).","적용제외"],
[2,"「개인정보 보호법」 제59조 금지행위에 해당하지 않는 것은?",
["거짓이나 그 밖의 부정한 수단이나 방법으로 개인정보를 취득하거나 처리에 관한 동의를 받는 행위","업무상 알게 된 개인정보를 누설하거나 권한 없이 다른 사람이 이용하도록 제공하는 행위","정당한 권한 없이 또는 허용된 권한을 초과하여 다른 사람의 개인정보를 이용, 훼손, 멸실, 변경, 위조 또는 유출하는 행위","업무상 알게 된 개인정보를 정보주체 본인의 요구에 따라 본인에게 제공하는 행위","개인정보를 처리하거나 처리하였던 자가 업무상 알게 된 개인정보를 누설하는 행위"],
3,"정보주체 본인에게 제공하는 것은 열람권 보장이며 금지행위가 아니다. 제59조는 '개인정보를 처리하거나 처리하였던 자'의 세 가지 금지행위를 규정하며 위반 시 제71조(5년 이하 징역 또는 5천만원 이하 벌금) 등으로 처벌된다.","금지행위"],
[2,"「개인정보 보호법」 벌칙 중 가장 중한 법정형(10년 이하의 징역 또는 1억원 이하의 벌금)이 적용되는 행위는?",
["공공기관의 개인정보 처리업무를 방해할 목적으로 공공기관에서 처리하고 있는 개인정보를 변경하거나 말소하여 업무 수행의 중단·마비 등 심각한 지장을 초래한 행위","정보주체의 동의 없이 개인정보를 제3자에게 제공한 행위","업무상 알게 된 개인정보를 누설한 행위","영상정보처리기기를 설치 목적과 다른 목적으로 임의 조작한 행위","정보주체의 동의를 받지 않고 개인정보를 수집한 행위"],
0,"제70조(10년/1억): 공공기관 개인정보 변경·말소로 업무 마비, 거짓·부정한 수단으로 취득한 개인정보를 영리·부정한 목적으로 제3자 제공(교사·알선 포함). 동의 없는 제3자 제공은 제71조(5년/5천만원), 임의 조작은 제72조(3년/3천만원), 업무상 누설은 제71조, 동의 없는 수집은 과징금(전체 매출액 3% 이하) 대상이다.","벌칙"],
[2,"2023년 개정 「개인정보 보호법」에서 정보주체의 동의 없이 개인정보를 수집(제15조 제1항 위반)한 경우의 제재로 옳은 것은?",
["5년 이하의 징역 또는 5천만원 이하의 벌금","3년 이하의 징역 또는 3천만원 이하의 벌금","5천만원 이하의 과태료","1천만원 이하의 과태료","전체 매출액의 3%를 초과하지 않는 범위의 과징금"],
4,"2023년 개정(2023.9.15 시행)으로 제15조 제1항 위반 수집은 형벌(5년/5천만원)에서 과징금(제64조의2 제1항 제1호, 전체 매출액 3% 이하)으로 전환되었고, 구법의 '5천만원 이하 과태료'(제75조 제1항) 조항도 삭제되었다. 거짓·부정한 수단으로 수집하면 제72조(3년/3천만원) 형사처벌 대상이다.","벌칙"],
[2,"「정보통신망법」상 영리목적 광고성 정보 전송에 대한 설명으로 옳지 않은 것은?",
["전자적 전송매체를 이용하여 광고성 정보를 전송하려면 수신자의 명시적인 사전 동의를 받아야 한다(옵트인).","오후 9시부터 다음 날 오전 8시까지 전송하려면 별도의 사전 동의를 받아야 한다(전자우편 제외).","수신동의를 받은 자는 2년마다 수신자의 동의 여부를 확인하여야 한다.","수신자가 수신거부 의사를 표시한 경우에도 1회에 한하여 광고를 전송할 수 있다.","수신거부 또는 동의 철회 처리 결과를 14일 이내에 수신자에게 알려야 한다."],
3,"정보통신망법 제50조. 수신거부 또는 사전 동의 철회 의사를 표시한 자에게는 광고성 정보를 전송할 수 없다. 거래관계가 있는 경우 6개월 이내 등 일부 예외가 있으나, 수신거부자에게 전송하는 것은 금지된다.","정보통신망법"],
[2,"개인정보 전송요구권(본인전송요구, 제35조의2)에 대한 설명으로 옳지 않은 것은?",
["정보주체는 개인정보처리자에게 자신의 개인정보를 본인에게 전송할 것을 요구할 수 있다.","전송 요구 대상은 정보주체의 동의·계약 등을 근거로 처리되고 컴퓨터 등 정보처리장치로 처리되는 개인정보이다.","2026년 2월 공포된 시행령 개정으로 전송요구 대상이 산업 분야에 관계없이 확대되었다.","전송 의무를 부담하는 개인정보처리자(전송자)는 매출액·정보주체 수 등 일정 기준에 해당하는 자이다.","가명정보에 대해서도 전송요구권을 행사할 수 있다."],
4,"제28조의7에 따라 가명정보에는 제35조의2(전송요구)가 적용되지 않는다. 2026.2.19 공포된 시행령은 본인전송요구 대상을 전 산업 분야로 확대하였고 2026.8.20 시행되었다.","전송요구권"],
[2,"다음 중 「개인정보 보호법 시행령」상 고유식별정보에 해당하지 않는 것은?",
["주민등록번호","여권번호","운전면허번호","외국인등록번호","신용카드번호"],
4,"시행령 제19조: 고유식별정보는 주민등록번호, 여권번호, 운전면허의 면허번호, 외국인등록번호 4가지이다. 신용카드번호·계좌번호·건강보험증번호는 고유식별정보가 아니다.","고유식별"],
[2,"주민등록번호 처리 제한(제24조의2)에 대한 설명으로 옳지 않은 것은?",
["법률·대통령령·국회규칙·대법원규칙·헌법재판소규칙·중앙선거관리위원회규칙·감사원규칙에서 구체적으로 주민등록번호 처리를 요구하거나 허용한 경우 처리할 수 있다.","정보주체 또는 제3자의 급박한 생명, 신체, 재산의 이익을 위하여 명백히 필요한 경우 처리할 수 있다.","보호위원회가 고시로 정하는 경우 처리할 수 있다.","정보주체의 별도 동의가 있으면 법령 근거 없이도 주민등록번호를 처리할 수 있다.","인터넷 홈페이지를 통하여 회원으로 가입하는 단계에서는 주민등록번호를 사용하지 않고도 가입할 수 있는 방법을 제공하여야 한다."],
3,"주민등록번호는 다른 고유식별정보와 달리 정보주체의 동의만으로는 처리할 수 없다(법정주의). 또한 주민등록번호는 암호화 조치를 통해 안전하게 보관하여야 한다.","주민등록번호"],

[3,"「개인정보 보호법」 제15조 제1항에 따라 개인정보를 수집·이용할 수 있는 경우에 해당하지 않는 것은?",
["정보주체의 동의를 받은 경우","법률에 특별한 규정이 있거나 법령상 의무를 준수하기 위하여 불가피한 경우","공공기관이 법령 등에서 정하는 소관 업무의 수행을 위하여 불가피한 경우","정보주체와 체결한 계약을 이행하거나 계약을 체결하는 과정에서 정보주체의 요청에 따른 조치를 이행하기 위하여 필요한 경우","개인정보처리자의 영업 이익 증대에 필요한 경우"],
4,"제15조 제1항은 ①동의 ②법률 특별규정·법령상 의무 ③공공기관 소관업무 ④계약 체결·이행 ⑤급박한 생명·신체·재산 이익 ⑥정당한 이익(명백히 우선) ⑦공중위생 등 공공의 안전과 안녕을 위해 긴급히 필요한 경우를 규정한다.","수집근거"],
[3,"개인정보처리자의 정당한 이익을 달성하기 위하여 필요한 경우(제15조 제1항 제6호)의 요건으로 옳지 않은 것은?",
["정당한 이익이 명백히 정보주체의 권리보다 우선하여야 한다.","개인정보처리자의 정당한 이익과 상당한 관련이 있어야 한다.","합리적인 범위를 초과하지 아니하여야 한다.","정당한 이익이 있으면 정보주체의 권리와 관계없이 수집할 수 있다.","2023년 개정으로 계약 관련 수집 근거는 '불가피하게 필요한 경우'에서 '필요한 경우'로 완화되었다."],
3,"제6호는 정당한 이익이 '명백하게' 정보주체 권리보다 우선하는 경우로서 상당한 관련성과 합리적 범위를 요구한다. 이익이 있다고 무조건 수집 가능한 것은 아니다.","수집근거"],
[3,"개인정보 수집·이용 동의를 받을 때 정보주체에게 알려야 하는 사항(제15조 제2항)에 해당하지 않는 것은?",
["개인정보의 수집·이용 목적","수집하려는 개인정보의 항목","개인정보의 보유 및 이용 기간","동의를 거부할 권리가 있다는 사실 및 거부에 따른 불이익이 있는 경우 그 내용","개인정보 보호책임자의 성명과 연락처"],
4,"수집·이용 동의 시 고지사항은 ①목적 ②항목 ③보유·이용 기간 ④동의 거부권 및 불이익 4가지이다. CPO 연락처는 처리방침 기재사항이다.","동의"],
[3,"개인정보를 제3자에게 제공하기 위해 동의를 받을 때 알려야 하는 사항(제17조 제2항)에 해당하지 않는 것은?",
["개인정보를 제공받는 자","개인정보를 제공받는 자의 개인정보 이용 목적","제공하는 개인정보의 항목","개인정보를 제공받는 자의 개인정보 보유 및 이용 기간","제공하는 자의 개인정보 처리방침 인터넷 주소"],
4,"제3자 제공 동의 고지사항은 ①제공받는 자 ②제공받는 자의 이용 목적 ③제공 항목 ④제공받는 자의 보유·이용 기간 ⑤동의 거부권 및 불이익 5가지이다.","제3자제공"],
[3,"개인정보의 '제3자 제공'과 '처리 위탁'의 구분에 대한 설명으로 옳지 않은 것은?",
["제3자 제공은 제공받는 자의 업무 목적으로, 위탁은 위탁자의 업무 목적으로 개인정보가 이전된다.","제3자 제공은 원칙적으로 정보주체의 동의가 필요하다.","처리 위탁 시에도 정보주체의 별도 동의를 받아야 한다.","위탁자는 위탁하는 업무의 내용과 수탁자를 공개하여야 한다.","위탁 시 수탁자에 대한 관리·감독 책임은 위탁자에게 있다."],
2,"처리 위탁은 동의 대상이 아니며, 위탁 업무 내용과 수탁자 공개(홍보·판매 권유 업무 위탁 시 통지)로 갈음한다. 반면 제3자 제공은 제17조에 따라 동의 등 적법 근거가 필요하다.","위탁"],
[3,"만 14세 미만 아동의 개인정보 처리(제22조의2)에 대한 설명으로 옳지 않은 것은?",
["만 14세 미만 아동의 개인정보를 처리하기 위해 동의를 받으려면 법정대리인의 동의를 받아야 한다.","법정대리인의 동의를 받기 위하여 필요한 최소한의 정보(성명·연락처)는 법정대리인의 동의 없이 아동으로부터 직접 수집할 수 있다.","아동에게 개인정보 처리 관련 사항을 고지할 때는 이해하기 쉬운 양식과 명확하고 알기 쉬운 언어를 사용하여야 한다.","만 19세 미만의 미성년자는 모두 법정대리인의 동의를 받아야 한다.","법정대리인 동의 의무 위반 시 3천만원 이하의 과태료가 부과될 수 있다."],
3,"법정대리인 동의 요건은 '만 14세 미만 아동'에 한한다. 만 14세 이상 미성년자는 스스로 동의할 수 있다.","아동"],
[3,"개인정보 수집 제한(제16조)에 대한 설명으로 옳지 않은 것은?",
["목적에 필요한 최소한의 개인정보를 수집하여야 한다.","최소한의 개인정보 수집이라는 입증책임은 정보주체가 부담한다.","정보주체의 동의를 받아 수집하는 경우 필요한 최소한의 정보 외의 정보 수집에는 동의하지 아니할 수 있다는 사실을 구체적으로 알려야 한다.","정보주체가 필요한 최소한의 정보 외의 개인정보 수집에 동의하지 아니한다는 이유로 재화 또는 서비스 제공을 거부하여서는 아니 된다.","필요 최소한 수집 원칙은 동의 외의 다른 적법 근거로 수집하는 경우에도 적용된다."],
1,"제16조 제1항 후단: 최소한의 개인정보 수집이라는 입증책임은 '개인정보처리자'가 부담한다.","수집제한"],
[3,"정보주체 이외로부터 수집한 개인정보의 수집 출처 등 고지(제20조)에 대한 설명으로 옳지 않은 것은?",
["정보주체의 요구가 있으면 즉시 개인정보의 수집 출처, 처리 목적, 처리정지 요구권(동의 철회권)을 알려야 한다.","5만명 이상의 민감정보·고유식별정보 또는 100만명 이상의 개인정보를 처리하는 자는 정보주체 이외로부터 수집하여 처리하는 경우 정보주체의 요구가 없어도 알려야 한다.","요구가 없는 경우에도 알려야 하는 처리자는 연락처를 알고 있는 경우 수집한 날부터 3개월 이내에 통지하여야 한다.","정보주체의 요구를 받은 날부터 30일 이내에 알리면 된다.","통지 대상 정보가 개인정보파일에 포함되어 있지 않거나 다른 사람의 생명·신체를 해할 우려가 있는 경우 등은 예외가 인정된다."],
3,"제20조 제1항은 정보주체의 요구가 있으면 '즉시' 알리도록 한다. 대규모 처리자의 선제적 통지는 시행령상 3개월 이내(연 1회 이상 통지 시 대체 가능)이다.","수집출처"],
[3,"개인정보 이용·제공 내역 통지(제20조의2)의 의무 대상과 주기로 옳은 것은?",
["5만명 이상의 민감정보·고유식별정보 또는 100만명 이상의 개인정보를 처리하는 자가 연 1회 이상 통지","모든 개인정보처리자가 연 2회 이상 통지","공공기관만 연 1회 통지","1만명 이상의 개인정보를 처리하는 자가 분기 1회 통지","통지 의무는 정보주체의 요구가 있을 때만 발생"],
0,"시행령 제15조의3. 5만명 이상 민감·고유식별정보 또는 100만명 이상 개인정보를 처리하는 자는 이용·제공 내역(또는 확인 방법)을 연 1회 이상 통지해야 한다. 연락처가 없는 경우 등은 예외.","이용내역통지"],
[3,"목적 외 이용·제공(제18조 제2항)의 사유 중 '공공기관'에만 허용되는 것은?",
["정보주체로부터 별도의 동의를 받은 경우","다른 법률에 특별한 규정이 있는 경우","명백히 정보주체 또는 제3자의 급박한 생명·신체·재산의 이익을 위하여 필요하다고 인정되는 경우","범죄의 수사와 공소의 제기 및 유지를 위하여 필요한 경우","공중위생 등 공공의 안전과 안녕을 위하여 긴급히 필요한 경우"],
3,"제18조 제2항 제5호~제9호(법령상 소관업무 수행 불가, 조약 등 국제협정 이행, 범죄 수사·공소, 법원 재판업무, 형 및 감호·보호처분 집행)는 공공기관에 한하여 적용된다.","목적외이용"],
[3,"공공기관이 개인정보를 목적 외로 이용하거나 제3자에게 제공하는 경우의 절차에 대한 설명으로 옳지 않은 것은?",
["이용·제공한 날부터 30일 이내에 관보 또는 인터넷 홈페이지에 그 법적 근거, 목적 및 범위 등을 게재하여야 한다.","인터넷 홈페이지에 게재하는 경우 10일 이상 게재하여야 한다.","목적 외 이용·제공 대장을 기록·관리하여야 한다.","제3자에게 제공하는 경우 이용 목적·방법 제한 또는 안전성 확보에 필요한 조치를 마련하도록 요청하여야 한다.","민간기업도 목적 외 이용 시 관보에 게재하여야 한다."],
4,"관보·홈페이지 게재 의무(시행령 제15조)는 공공기관에만 적용된다. 민간 개인정보처리자는 제3자 제공 시 제공받는 자에게 이용 목적·방법 제한 등 안전조치를 요청하는 의무가 있다.","목적외이용"],
[3,"민감정보의 처리(제23조)에 대한 설명으로 옳지 않은 것은?",
["다른 개인정보의 처리에 대한 동의와 별도로 동의를 받은 경우 처리할 수 있다.","법령에서 민감정보의 처리를 요구하거나 허용하는 경우 처리할 수 있다.","민감정보는 일반 개인정보 수집·이용 동의서에 포함하여 함께 동의받을 수 있다.","민감정보를 처리하는 경우 분실·도난·유출·위조·변조·훼손되지 않도록 안전성 확보에 필요한 조치를 하여야 한다.","재화·서비스 제공 과정에서 공개되는 정보에 민감정보가 포함되어 사생활 침해 위험이 있다고 판단되면 공개 가능성 및 비공개 선택 방법을 알기 쉽게 알려야 한다."],
2,"민감정보는 제22조 제1항 제3호에 따라 다른 개인정보와 '구분하여 별도로' 동의를 받아야 한다. 제23조 제3항(공개 가능성 고지)은 2023년 개정으로 신설되었다.","민감정보"],
[3,"고유식별정보의 처리(제24조)에 대한 설명으로 옳지 않은 것은?",
["다른 개인정보 처리 동의와 별도로 동의를 받거나 법령에서 구체적으로 요구·허용하는 경우 처리할 수 있다.","고유식별정보를 처리하는 경우 암호화 등 안전성 확보에 필요한 조치를 하여야 한다.","보호위원회는 공공기관(1만명 이상) 및 5만명 이상의 고유식별정보를 처리하는 자에 대하여 안전조치 이행 여부를 정기적으로 조사하여야 한다.","여권번호·운전면허번호·외국인등록번호도 주민등록번호와 동일하게 정보주체의 동의만으로는 처리할 수 없다.","고유식별정보 안전조치 조사는 3년마다 1회 이상 실시한다(2024.3 시행령 개정, 구 2년)."],
3,"동의만으로 처리할 수 없는 것은 '주민등록번호'(제24조의2)에 한한다. 여권번호·운전면허번호·외국인등록번호는 별도 동의로 처리할 수 있다.","고유식별"],
[3,"공개된 장소에 고정형 영상정보처리기기를 설치·운영할 수 있는 경우(제25조 제1항)에 해당하지 않는 것은?",
["법령에서 구체적으로 허용하고 있는 경우","범죄의 예방 및 수사를 위하여 필요한 경우","시설의 안전 및 관리, 화재 예방을 위하여 정당한 권한을 가진 자가 설치·운영하는 경우","교통단속 또는 교통정보의 수집·분석 및 제공을 위하여 필요한 경우","근로자의 근무 태도를 감시하기 위하여 필요한 경우"],
4,"제25조 제1항 사유: 법령 허용, 범죄 예방·수사, 시설 안전·관리·화재 예방, 교통단속, 교통정보 수집·분석·제공, 촬영 영상을 저장하지 않는 경우로서 대통령령으로 정하는 경우(2023 신설). 근무 감시는 사유가 아니다.","영상정보처리기기"],
[3,"고정형 영상정보처리기기 운영에 대한 설명으로 옳지 않은 것은?",
["목욕실, 화장실, 발한실, 탈의실 등 사생활을 현저히 침해할 우려가 있는 장소의 내부는 설치·운영이 금지된다.","교정시설, 정신의료기관 등은 금지 장소 규정의 예외가 인정된다.","안내판에는 설치 목적 및 장소, 촬영 범위 및 시간, 관리책임자의 연락처 등을 기재하여야 한다.","설치 목적과 다른 목적으로 임의로 조작하거나 다른 곳을 비추는 것은 허용되나, 녹음 기능은 사용할 수 없다.","운영자는 영상정보처리기기 운영·관리 방침을 마련하여야 한다."],
3,"제25조 제5항: 설치 목적과 다른 목적으로 임의 조작하거나 다른 곳을 비추어서는 아니 되며, 녹음기능은 사용할 수 없다. 둘 모두 금지된다(위반 시 3년 이하 징역 또는 3천만원 이하 벌금).","영상정보처리기기"],
[3,"이동형 영상정보처리기기(제25조의2)에 대한 설명으로 옳지 않은 것은?",
["업무를 목적으로 공개된 장소에서 이동형 영상정보처리기기로 사람 또는 그 사람과 관련된 사물의 영상을 촬영하는 경우에 적용된다.","제15조 제1항 각 호의 어느 하나에 해당하는 경우 촬영할 수 있다.","촬영 사실을 명확히 표시하여 정보주체가 촬영 사실을 알 수 있도록 하였음에도 거부 의사를 밝히지 아니한 경우 촬영할 수 있다(권리 침해 우려 없고 합리적 범위 내).","촬영 사실은 불빛, 소리, 안내판 등의 방법으로 표시하여야 한다.","드론·자율주행차 등 이동형 기기는 영상정보처리기기에 해당하지 않아 보호법이 적용되지 않는다."],
4,"2023년 개정으로 이동형 영상정보처리기기(드론, 자율주행차, 웨어러블 기기 등) 규정이 신설되었다. 공개된 장소가 아닌 목욕실 등에서의 촬영은 금지된다.","영상정보처리기기"],
[3,"개인정보 처리 업무 위탁 시 문서에 포함되어야 하는 사항(제26조 제1항)에 해당하지 않는 것은?",
["위탁업무 수행 목적 외 개인정보의 처리 금지에 관한 사항","개인정보의 기술적·관리적 보호조치에 관한 사항","위탁업무의 목적 및 범위, 재위탁 제한에 관한 사항","개인정보에 대한 접근 제한 등 안전성 확보 조치 및 관리·감독에 관한 사항","수탁자의 연간 매출액 및 임직원 수"],
4,"제26조 제1항·시행령 제28조: 목적 외 처리 금지, 보호조치, 위탁 목적·범위, 재위탁 제한, 접근 제한 등 안전조치, 관리·감독(위탁업무 처리 현황 점검 등), 손해배상 등 책임에 관한 사항을 문서에 포함한다.","위탁"],
[3,"개인정보 처리 업무 위탁에 대한 설명으로 옳지 않은 것은?",
["위탁자는 위탁하는 업무의 내용과 수탁자를 정보주체가 쉽게 확인할 수 있도록 공개하여야 한다.","재화 또는 서비스를 홍보하거나 판매를 권유하는 업무를 위탁하는 경우 위탁 업무 내용과 수탁자를 정보주체에게 알려야 한다.","위탁자는 수탁자가 개인정보를 안전하게 처리하는지를 감독하고 교육하여야 한다.","수탁자는 위탁자의 동의 없이도 자유롭게 제3자에게 재위탁할 수 있다.","수탁자가 위탁받은 업무와 관련하여 개인정보를 처리하는 과정에서 법을 위반하여 발생한 손해배상책임에 대하여는 수탁자를 개인정보처리자의 소속 직원으로 본다."],
3,"2023년 개정 제26조 제6항: 수탁자는 위탁받은 업무를 제3자에게 다시 위탁하려는 경우 위탁자의 동의를 받아야 한다.","위탁"],
[3,"영업의 양도·합병 등에 따른 개인정보 이전(제27조)에 대한 설명으로 옳지 않은 것은?",
["영업양도자 등은 개인정보를 이전하기 전에 이전 사실 등을 정보주체에게 알려야 한다.","알려야 할 사항은 개인정보를 이전하려는 사실, 양수자의 성명(법인명)·주소·전화번호 등 연락처, 이전을 원하지 아니하는 경우의 조치 방법 및 절차이다.","영업양수자 등은 양도자가 알리지 아니한 경우 지체 없이 그 사실을 정보주체에게 알려야 한다.","영업양수자 등은 이전 당시의 본래 목적으로만 개인정보를 이용하거나 제3자에게 제공할 수 있다.","영업 양도 시 개인정보를 이전하려면 정보주체의 별도 동의를 받아야 한다."],
4,"영업양도에 따른 이전은 '통지'로 족하며 별도 동의가 요구되지 않는다. 다만 이전을 원하지 않는 정보주체가 조치할 방법·절차를 알려야 한다.","영업양도"],
[3,"가명정보를 정보주체의 동의 없이 처리할 수 있는 목적(제28조의2)에 해당하지 않는 것은?",
["통계작성(시장조사 등 상업적 목적 포함)","과학적 연구(산업적 연구 포함)","공익적 기록보존","마케팅 목적의 광고 발송","역사·과학적 연구를 위한 공익적 기록보존"],
3,"가명정보 특례 목적은 통계작성, 과학적 연구, 공익적 기록보존 3가지이다. 특정 개인을 대상으로 한 마케팅은 가명정보 처리 목적에 해당하지 않는다.","가명정보"],
[3,"가명정보의 결합 및 처리에 대한 설명으로 옳지 않은 것은?",
["서로 다른 개인정보처리자 간 가명정보의 결합은 보호위원회 또는 관계 중앙행정기관의 장이 지정하는 전문기관이 수행한다.","결합된 정보를 전문기관 외부로 반출하려면 전문기관의 장의 승인을 받아야 한다.","누구든지 특정 개인을 알아보기 위한 목적으로 가명정보를 처리해서는 아니 된다.","가명정보 처리 과정에서 특정 개인을 알아볼 수 있는 정보가 생성된 경우 즉시 처리를 중지하고 지체 없이 회수·파기하여야 한다.","서로 다른 개인정보처리자 간 가명정보 결합은 각 처리자가 자체적으로 수행할 수 있다."],
4,"제28조의3: 처리자 간 가명정보 결합은 지정된 결합전문기관이 수행하며, 반출은 전문기관의 승인이 필요하다. 재식별 목적 처리 시 과징금(전체 매출액 3% 이하) 대상이다.","가명정보"],
[3,"가명정보 처리에 대한 특례(제28조의7)에 따라 가명정보에도 '적용되는' 규정은?",
["제29조 안전조치 의무","제35조 개인정보의 열람","제36조 개인정보의 정정·삭제","제37조 개인정보의 처리정지 등","제34조 제1항 개인정보 유출등의 통지"],
0,"가명정보에는 제20조(수집출처 고지), 제20조의2, 제27조(영업양도), 제34조 제1항(유출 통지), 제35조(열람), 제35조의2(전송요구), 제36조(정정·삭제), 제37조(처리정지)가 적용되지 않는다. 안전조치(제29조)와 유출 신고 의무는 적용된다.","가명정보"],
[3,"가명정보를 처리하는 경우 작성·보관하여야 하는 관련 기록에 포함되는 사항으로 적절하지 않은 것은?",
["가명정보 처리의 목적","가명처리한 개인정보의 항목","가명정보의 이용 내역","제3자 제공 시 제공받는 자","가명처리 전 원본 개인정보 전체 사본"],
4,"시행령 제29조의5. 가명정보 처리 목적, 가명처리한 항목, 이용 내역, 제3자 제공 시 제공받는 자 등을 기록·보관한다. 원본을 함께 보관하면 추가 정보와의 분리 보관 원칙(제28조의4)에 반한다.","가명정보"],
[3,"개인정보의 국외 이전이 허용되는 경우(제28조의8 제1항)에 해당하지 않는 것은?",
["정보주체로부터 국외 이전에 관한 별도의 동의를 받은 경우","법률, 대한민국을 당사자로 하는 조약 또는 그 밖의 국제협정에 개인정보의 국외 이전에 관한 특별한 규정이 있는 경우","정보주체와의 계약 체결 및 이행을 위하여 개인정보의 처리위탁·보관이 필요한 경우로서 처리방침에 공개하거나 정보주체에게 알린 경우","개인정보를 이전받는 자가 보호위원회가 정하여 고시하는 인증을 받고 안전조치 및 권리보장 조치를 한 경우","개인정보를 이전받는 자가 외국 정부로부터 사업 허가를 받은 경우"],
4,"제28조의8 제1항은 동의, 법률·조약 규정, 계약 이행을 위한 위탁·보관(공개·통지), 인증, 보호위원회가 인정하는 국가·국제기구(동등성 인정) 5가지를 규정한다.","국외이전"],
[3,"개인정보 국외 이전 동의를 받을 때 알려야 하는 사항(제28조의8 제2항)에 해당하지 않는 것은?",
["이전되는 개인정보 항목","개인정보가 이전되는 국가, 시기 및 방법","개인정보를 이전받는 자의 성명(법인인 경우 명칭과 연락처)","개인정보를 이전받는 자의 이용 목적 및 보유·이용 기간","이전받는 국가의 개인정보 보호 법령 전문"],
4,"국외 이전 동의 고지사항은 ①항목 ②국가·시기·방법 ③이전받는 자 ④이전받는 자의 목적 및 보유·이용 기간 ⑤이전 거부 방법·절차 및 거부 효과 5가지이다.","국외이전"],
[3,"개인정보 국외 이전 중지 명령(제28조의9)을 내릴 수 있는 주체는?",
["개인정보 보호위원회","과학기술정보통신부장관","외교부장관","방송통신위원회","한국인터넷진흥원장"],
0,"보호위원회는 국외 이전이 요건을 위반하거나 이전받는 국가의 보호수준이 미흡하여 정보주체에게 피해가 발생할 우려가 있는 경우 이전 중지를 명할 수 있다. 명령에 불복하면 7일 이내 이의를 제기할 수 있다.","국외이전"],
[3,"개인정보의 파기(제21조)에 대한 설명으로 옳지 않은 것은?",
["보유기간 경과, 처리 목적 달성 등 개인정보가 불필요하게 되었을 때 지체 없이(5일 이내) 파기하여야 한다.","전자적 파일 형태의 개인정보는 복원이 불가능한 방법으로 영구 삭제하여야 한다.","기록물, 인쇄물, 서면 등은 파쇄 또는 소각한다.","다른 법령에 따라 보존하여야 하는 경우에는 해당 개인정보를 다른 개인정보와 함께 통합하여 보관한다.","파기 시 복구 또는 재생되지 아니하도록 조치하여야 한다."],
3,"제21조 제3항: 다른 법령에 따라 보존하는 경우 해당 개인정보 또는 개인정보파일을 다른 개인정보와 '분리하여' 저장·관리하여야 한다.","파기"],
[3,"정보주체의 개인정보 열람 요구(제35조)에 대한 설명으로 옳지 않은 것은?",
["정보주체는 개인정보처리자가 처리하는 자신의 개인정보에 대한 열람을 요구할 수 있다.","공공기관에 대하여는 보호위원회를 통하여 열람을 요구할 수 있다.","개인정보처리자는 열람 요구를 받은 날부터 30일 이내에 열람할 수 있도록 하여야 한다.","법률에 따라 열람이 금지·제한되는 경우, 다른 사람의 생명·신체를 해할 우려가 있는 경우 등에는 열람을 제한·거절할 수 있다.","열람을 제한·거절하는 경우 그 사유를 정보주체에게 알려야 한다."],
2,"시행령 제41조: 열람 요구를 받은 날부터 '10일 이내'에 열람하게 하여야 한다. 정정·삭제(제36조), 처리정지(제37조)도 10일 이내 조치가 원칙이다.","열람"],
[3,"정보주체의 처리정지 요구(제37조)를 개인정보처리자가 거절할 수 있는 사유에 해당하지 않는 것은?",
["법률에 특별한 규정이 있거나 법령상 의무를 준수하기 위하여 불가피한 경우","다른 사람의 생명·신체를 해할 우려가 있거나 다른 사람의 재산과 그 밖의 이익을 부당하게 침해할 우려가 있는 경우","공공기관이 개인정보를 처리하지 아니하면 다른 법률에서 정하는 소관 업무를 수행할 수 없는 경우","개인정보를 처리하지 아니하면 정보주체와 약정한 서비스를 제공하지 못하는 등 계약 이행이 곤란한 경우로서 정보주체가 계약 해지 의사를 명확하게 밝히지 아니한 경우","개인정보처리자의 영업 손실이 예상되는 경우"],
4,"제37조 제2항의 거절 사유는 4가지로 한정되며 영업상 손실은 거절 사유가 아니다. 2023년 개정으로 정보주체의 동의 철회권도 제37조에 명시되었다.","처리정지"],
[3,"자동화된 결정에 대한 정보주체의 권리(제37조의2)에 대한 설명으로 옳지 않은 것은?",
["완전히 자동화된 시스템(인공지능 기술 적용 시스템 포함)으로 개인정보를 처리하여 이루어지는 결정이 정보주체의 권리 또는 의무에 중대한 영향을 미치는 경우 거부할 수 있다.","정보주체는 자동화된 결정에 대하여 설명 등을 요구할 수 있다.","개인정보처리자는 자동화된 결정의 기준과 절차 등을 공개하여야 한다.","정보주체의 동의, 법률 규정, 계약 체결·이행에 따라 이루어진 자동화된 결정이라도 정보주체는 거부할 수 있다.","이 규정은 2024년 3월 15일부터 시행되었다."],
3,"제37조의2 제1항 단서: 자동화된 결정이 제15조 제1항 제1호(동의)·제2호(법률)·제4호(계약)에 따라 이루어지는 경우에는 거부권이 인정되지 않고 설명 요구권만 행사할 수 있다.","자동화결정"],
[3,"개인정보 유출등 통지(제34조 제1항) 시 정보주체에게 알려야 하는 사항에 해당하지 않는 것은?",
["유출등이 된 개인정보의 항목","유출등이 된 시점과 그 경위","유출등으로 인하여 발생할 수 있는 피해를 최소화하기 위하여 정보주체가 할 수 있는 방법","개인정보처리자의 대응조치 및 피해 구제절차","유출에 책임이 있는 담당 직원의 성명"],
4,"통지 사항 5가지: 항목, 시점·경위, 피해 최소화 방법, 대응조치 및 피해 구제절차, 피해 신고·상담 담당부서 및 연락처. 2026년 개정으로 '유출등의 가능성이 있는 개인정보 항목' 등 가능성 통지 사항도 추가되었다.","유출통지"],
[3,"개인정보 유출등의 신고(제34조 제3항, 시행령 제40조)에 대한 설명으로 옳지 않은 것은?",
["1천명 이상의 정보주체에 관한 개인정보가 유출등이 된 경우 신고하여야 한다.","민감정보 또는 고유식별정보가 유출등이 된 경우에는 정보주체 수와 무관하게 신고하여야 한다.","개인정보처리시스템 또는 개인정보취급자의 PC 등에 대한 외부로부터의 불법적인 접근에 의해 유출등이 된 경우 신고하여야 한다.","신고는 유출등을 알게 된 때부터 72시간 이내에 보호위원회 또는 한국인터넷진흥원에 하여야 한다.","1만명 이상 유출된 경우에만 신고 의무가 있다."],
4,"신고 기준은 ①1천명 이상 ②민감·고유식별정보 ③불법적 외부 접근(해킹) 중 하나이다. 정보주체 통지도 72시간 이내가 원칙이며, 1천명 이상 유출 시 홈페이지에 30일 이상 게재해야 한다.","유출신고"],
[3,"2026년 9월 11일 시행된 개정 「개인정보 보호법」에 따른 '유출등'의 범위로 옳은 것은?",
["분실·도난·유출","분실·도난·유출·위조·변조·훼손","유출·위조·변조","도난·유출","분실·유출·훼손"],
1,"개정 전 '유출등'은 분실·도난·유출만을 의미했으나, 개정법은 위조·변조·훼손까지 포함하여 통지·신고 범위를 확대하였다. 또한 '유출등의 가능성'이 있음을 알게 된 때에도 정보주체에게 알리는 유출 가능성 통지제가 도입되었다.","2026개정"],
[3,"정보주체의 권리 행사 방법 및 절차(제38조)에 대한 설명으로 옳지 않은 것은?",
["정보주체는 법정대리인 또는 위임을 받은 자 등 대리인을 통하여 권리를 행사할 수 있다.","만 14세 미만 아동의 법정대리인은 아동의 개인정보에 대한 열람 등을 요구할 수 있다.","개인정보처리자는 권리 행사 방법·절차를 개인정보 수집 방법·절차보다 어렵지 않도록 하여야 한다.","개인정보처리자는 어떠한 경우에도 열람 등 요구에 대한 수수료를 청구할 수 없다.","정보주체가 열람 등 요구를 할 수 있는 구체적 방법·절차를 마련하고 공개하여야 한다."],
3,"제38조 제3항: 개인정보처리자는 열람 등 요구를 하는 자에게 '수수료와 우송료(사본 송부를 청구하는 경우)'를 청구할 수 있다.","권리행사"],
[3,"정보주체의 동의를 받는 방법(제22조)에 대한 설명으로 옳지 않은 것은?",
["동의를 받을 때는 각각의 동의 사항을 구분하여 정보주체가 이를 명확하게 인지할 수 있도록 알리고 동의를 받아야 한다.","목적 외 이용·제공, 민감정보, 고유식별정보, 홍보·판매 권유 목적 처리에 대한 동의는 다른 동의와 구분하여 받아야 한다.","정보주체가 선택적으로 동의할 수 있는 사항을 동의하지 아니하였다는 이유로 재화·서비스 제공을 거부하여서는 아니 된다.","재화나 서비스를 홍보하거나 판매를 권유하기 위한 동의는 수집·이용 동의와 통합하여 받을 수 있다.","서면으로 동의를 받을 때는 중요한 내용을 명확히 표시하여 알아보기 쉽게 하여야 한다."],
3,"제22조 제4항: 홍보·판매 권유 목적으로 개인정보 처리 동의를 받으려는 때에는 정보주체가 이를 명확하게 인지할 수 있도록 알리고 동의를 받아야 하며, 다른 동의와 구분하여야 한다.","동의"],

[4,"「개인정보 보호법」 제29조 및 시행령 제30조에서 정한 안전성 확보에 필요한 조치의 영역에 해당하지 않는 것은?",
["개인정보의 안전한 처리를 위한 내부 관리계획의 수립·시행 및 점검","개인정보에 대한 접근 통제 및 접근 권한의 제한 조치","개인정보를 안전하게 저장·전송할 수 있는 암호화 기술의 적용","개인정보 침해사고 발생에 대응하기 위한 접속기록의 보관 및 위조·변조 방지 조치","개인정보 손해배상책임 보장을 위한 보험 가입"],
4,"시행령 제30조 안전조치: 내부관리계획, 접근 권한 관리·접근 통제, 암호화, 접속기록 보관·점검, 보안프로그램 설치·갱신, 물리적 조치, 재해·재난 대비 등. 보험 가입은 제39조의7(손해배상책임 보장)의 별개 의무이다.","안전조치"],

["개인정보 보호책임자의 지정 및 역할·책임에 관한 사항","개인정보취급자에 대한 교육에 관한 사항","접근 권한의 관리 및 접근 통제에 관한 사항","개인정보 유출사고 대응 계획 및 재해·재난 대비 안전조치에 관한 사항","개인정보 보호책임자의 연봉 및 성과평가 기준"],
4,"내부 관리계획에는 CPO 지정, 역할·책임, 취급자 교육, 접근권한·접근통제, 암호화, 접속기록, 악성프로그램 방지, 물리적 안전조치, 재해·재난 대비, 위탁 시 수탁자 관리·감독, 유출사고 대응, 위험 분석 및 관리 등을 포함하고 연 1회 이상 이행 실태를 점검한다.","내부관리계획"],
[4,"개인정보처리시스템 접근 권한 관리에 대한 설명으로 옳지 않은 것은?",
["개인정보취급자에게 업무 수행에 필요한 최소한의 범위로 차등하여 접근 권한을 부여한다.","전보 또는 퇴직 등 인사이동이 발생한 경우 지체 없이 접근 권한을 변경 또는 말소한다.","접근 권한 부여·변경·말소 내역을 기록하고 그 기록을 최소 1년간 보관한다.","개인정보취급자별로 사용자 계정을 발급하고 다른 취급자와 공유되지 않도록 한다.","일정 횟수 이상 인증에 실패한 경우 접근을 제한하는 등 필요한 조치를 한다."],
2,"접근 권한 부여·변경·말소 기록은 최소 '3년간' 보관하여야 한다. 1년은 접속기록의 기본 보관기간이다.","접근권한"],
[4,"개인정보처리시스템 접속기록의 보관 및 점검에 대한 설명으로 옳지 않은 것은?",
["접속기록은 1년 이상 보관·관리하여야 한다.","5만명 이상의 정보주체에 관한 개인정보를 처리하거나 고유식별정보 또는 민감정보를 처리하는 개인정보처리시스템의 접속기록은 2년 이상 보관·관리하여야 한다.","접속기록은 내부 관리계획에 정한 주기와 방법에 따라 점검하여야 한다(2025.10 개정으로 '월 1회 이상' 문구 삭제).","개인정보를 다운로드한 것이 발견된 경우 그 사유를 반드시 확인하여야 한다.","접속기록은 6개월간만 보관하면 된다."],
4,"접속기록 보관은 1년 이상, 5만명 이상·고유식별·민감정보 처리 시스템 또는 기간통신사업자는 2년 이상이다. 위변조·도난·분실 방지를 위해 별도 저장장치에 백업 보관하여야 한다.","접속기록"],
[4,"접속기록에 포함되어야 하는 항목으로 적절하지 않은 것은?",
["개인정보취급자의 계정(식별자)","접속일시","접속지 정보(IP 주소 등)","처리한 정보주체 정보","개인정보취급자의 주민등록번호"],
4,"접속기록은 계정, 접속일시, 접속지 정보, 처리한 정보주체 정보, 수행업무(조회·변경·삭제·다운로드 등)를 전자적으로 기록한 것이다. 취급자의 주민등록번호는 포함되지 않는다.","접속기록"],
[4,"개인정보처리시스템 접근통제에 대한 설명으로 옳지 않은 것은?",
["정보통신망을 통한 불법적인 접근 및 침해사고 방지를 위해 접근 제한(침입차단) 및 유출 탐지(침입탐지) 기능을 갖춘 시스템을 운영한다.","개인정보취급자가 일정시간 이상 업무처리를 하지 않는 경우 자동으로 접속이 차단되도록 조치한다.","개인정보취급자가 인터넷 등 외부에서 개인정보처리시스템에 접속하는 경우 아이디와 비밀번호만으로 인증하면 충분하다.","개인정보가 인터넷 홈페이지, P2P, 공유설정 등을 통하여 열람권한이 없는 자에게 공개되거나 유출되지 않도록 조치한다.","업무용 모바일 기기의 분실·도난 등으로 개인정보가 유출되지 않도록 비밀번호 설정 등 보호조치를 한다."],
2,"외부에서 접속하는 경우 인증서, 보안토큰, 일회용 비밀번호(OTP) 등 안전한 인증수단을 적용하거나 VPN·전용선 등 안전한 접속수단을 적용하여야 한다.","접근통제"],
[4,"개인정보의 암호화에 대한 설명으로 옳지 않은 것은?",
["고유식별정보, 비밀번호, 생체인식정보를 정보통신망을 통하여 송신하거나 보조저장매체 등을 통하여 전달하는 경우 암호화하여야 한다.","비밀번호는 복호화가 가능한 양방향 암호화 방식으로 저장하여야 한다.","인터넷 구간 및 인터넷 구간과 내부망의 중간 지점(DMZ)에 고유식별정보를 저장하는 경우 암호화하여야 한다.","내부망에 주민등록번호를 저장하는 경우 암호화하여야 한다.","업무용 컴퓨터 또는 모바일 기기에 고유식별정보를 저장하는 경우 상용 암호화 소프트웨어 또는 안전한 암호화 알고리즘을 사용하여 암호화하여야 한다."],
1,"비밀번호는 복호화되지 아니하도록 '일방향 암호화(해시)'하여 저장하여야 한다. 안전한 알고리즘(SHA-2 계열 이상)과 솔트 적용이 권장된다.","암호화"],
[4,"내부망에 저장할 때 개인정보 영향평가 결과 또는 위험도 분석 결과에 따라 암호화 적용 여부·범위를 정할 수 있는 정보는?",
["주민등록번호","여권번호","비밀번호","생체인식정보","정보주체의 성명"],
1,"주민등록번호는 법 제24조의2 제2항에 따라 내부망 저장 시에도 암호화가 의무이다. 여권번호·운전면허번호·외국인등록번호는 내부망 저장 시 영향평가(공공기관) 또는 위험도 분석 결과에 따라 암호화 적용 여부를 정할 수 있다. 비밀번호·생체인식정보는 저장 시 암호화 대상이다.","암호화"],
[4,"다음 중 현재 안전하지 않은 것으로 평가되어 개인정보 암호화에 사용하지 않아야 하는 알고리즘은?",
["AES-256","SEED","ARIA","MD5","SHA-256"],
3,"MD5, SHA-1, DES, RC4, RSA-1024 등은 취약 알고리즘으로 사용을 권고하지 않는다. 안전한 알고리즘: 대칭키 AES·SEED·ARIA·LEA(128비트 이상), 공개키 RSA 2048비트 이상·ECC, 해시 SHA-224 이상(SHA-2/SHA-3).","암호알고리즘"],
[4,"대칭키 암호와 공개키(비대칭키) 암호에 대한 설명으로 옳지 않은 것은?",
["대칭키 암호는 암호화와 복호화에 동일한 키를 사용한다.","대칭키 암호는 키 분배와 관리가 어렵고, n명이 통신하려면 n(n-1)/2개의 키가 필요하다.","공개키 암호는 공개키와 개인키 쌍을 사용하며 전자서명에 활용될 수 있다.","공개키 암호는 대칭키 암호보다 연산 속도가 빠르다.","실제 시스템은 공개키로 대칭키(세션키)를 교환하고 데이터는 대칭키로 암호화하는 하이브리드 방식을 많이 사용한다."],
3,"공개키 암호(RSA, ECC)는 대칭키 암호(AES 등)보다 연산 속도가 훨씬 느리다. 그래서 키 교환은 공개키, 대량 데이터 암호화는 대칭키를 쓰는 하이브리드 방식이 일반적이다.","암호알고리즘"],
[4,"비밀번호를 해시하여 저장할 때 솔트(salt)를 적용하는 주된 목적은?",
["해시 연산 속도를 높이기 위해","동일한 비밀번호가 동일한 해시값을 갖지 않도록 하여 레인보우 테이블 공격 등에 대응하기 위해","비밀번호를 복호화할 수 있도록 하기 위해","비밀번호 길이를 줄여 저장 공간을 절약하기 위해","사용자가 비밀번호를 잊었을 때 원문을 복구하기 위해"],
1,"솔트는 사용자별 임의값을 비밀번호에 덧붙여 해시함으로써 사전·레인보우 테이블 공격을 무력화하고 같은 비밀번호도 다른 해시값을 갖게 한다. 해시는 일방향이므로 복호화 목적이 아니다.","암호화"],
[4,"프라이버시 보호 모델 중 l-다양성(l-diversity)이 주로 보완하려는 k-익명성의 취약점은?",
["링크 공격(linkage attack)","동질성 공격(homogeneity attack) 및 배경지식 공격","서비스 거부 공격","쏠림 공격(skewness attack)","유사성 공격(similarity attack)"],
1,"k-익명성은 동일 준식별자 레코드를 k개 이상 두어 연결 공격을 막지만, 동질집합의 민감속성이 모두 같으면 추론이 가능하다(동질성 공격). l-다양성은 각 집합에 l개 이상 다양한 민감속성 값을 요구하며, t-근접성은 쏠림·유사성 공격을 보완한다.","비식별"],
[4,"가명·익명처리 기술 중 '데이터 범주화(일반화)'에 해당하는 사례는?",
["홍길동 → 홍○○","나이 33세 → 30대","부서별 평균 급여로 대체","주민등록번호 항목 삭제","A 고객과 B 고객의 주소를 서로 교환"],
1,"범주화(라운딩, 상·하단 코딩 포함)는 값을 구간이나 범주로 변환하는 기법이다. ①은 마스킹, ③은 총계처리, ④는 데이터 삭제, ⑤는 무작위화(순열·교환)에 해당한다.","비식별"],
[4,"사용자에게 직무나 역할을 부여하고 그 역할에 따라 접근 권한을 결정하는 접근제어 모델은?",
["임의적 접근제어(DAC)","강제적 접근제어(MAC)","역할 기반 접근제어(RBAC)","속성 기반 접근제어(ABAC)","규칙 기반 접근제어(Rule-based)"],
2,"RBAC는 역할(Role)에 권한을 할당하고 사용자를 역할에 배정하는 모델로 조직 환경에 적합하다. DAC는 소유자가 재량으로 권한 부여, MAC는 보안 등급 레이블에 따라 시스템이 강제한다.","접근제어"],
[4,"인증 요소와 다중 인증(MFA)에 대한 설명으로 옳지 않은 것은?",
["지식 기반 인증은 비밀번호, PIN 등 사용자가 알고 있는 것을 이용한다.","소유 기반 인증은 OTP 토큰, 인증서, 스마트카드 등 사용자가 가지고 있는 것을 이용한다.","생체 기반 인증은 지문, 홍채, 얼굴 등 사용자의 고유한 신체 특성을 이용한다.","비밀번호와 PIN을 함께 사용하면 서로 다른 유형을 결합한 2요소 인증(2FA)에 해당한다.","2요소 인증은 서로 다른 유형의 인증 요소 2개를 결합하는 것이다."],
3,"비밀번호와 PIN은 모두 '지식' 요소이므로 같은 유형의 2단계 인증일 뿐 2요소 인증이 아니다. 2FA는 지식+소유(비밀번호+OTP) 등 다른 유형을 결합해야 한다.","인증"],
[4,"SQL Injection, XSS 등 웹 애플리케이션 계층의 공격을 탐지·차단하는 데 특화된 보안 장비는?",
["네트워크 방화벽(Firewall)","웹 방화벽(WAF)","NAC(Network Access Control)","DLP(Data Loss Prevention)","VPN"],
1,"WAF는 HTTP/HTTPS 트래픽을 분석하여 웹 공격을 차단한다. 네트워크 방화벽은 IP·포트 기반 접근통제, NAC는 단말의 네트워크 접근 통제, DLP는 내부 정보 유출 방지, VPN은 암호화 터널이다.","보안장비"],
[4,"침입탐지시스템(IDS)과 침입방지시스템(IPS)에 대한 설명으로 옳지 않은 것은?",
["IDS는 비정상 트래픽이나 침입 징후를 탐지하여 관리자에게 경고한다.","IPS는 인라인(in-line)으로 설치되어 탐지한 공격을 실시간으로 차단할 수 있다.","IDS는 능동적으로 공격을 차단하고 IPS는 탐지만 수행한다.","오탐(false positive)은 정상 행위를 공격으로 잘못 탐지하는 것이다.","탐지 방식에는 시그니처(오용) 기반과 이상행위(비정상) 기반이 있다."],
2,"IDS는 수동적 탐지·경고, IPS는 능동적 차단이다. 설명이 뒤바뀌어 있다.","보안장비"],
[4,"DMZ(Demilitarized Zone)와 네트워크 구성에 대한 설명으로 옳지 않은 것은?",
["DMZ는 외부 네트워크와 내부 네트워크 사이에 위치한 중립 구역이다.","웹서버, 메일서버 등 외부에 공개해야 하는 서버는 DMZ에 배치한다.","개인정보 DB 서버는 접근 편의를 위해 DMZ에 배치하는 것이 바람직하다.","DMZ에 개인정보를 저장하는 경우 고유식별정보 등은 암호화하여야 한다.","DMZ와 내부망 사이에는 방화벽 등으로 접근통제를 적용한다."],
2,"개인정보처리시스템(DB)은 내부망에 두고 DMZ에서 직접 접근하지 못하도록 접근통제를 적용해야 한다. 불가피하게 DMZ에 저장 시 암호화 의무가 있다.","네트워크"],
[4,"망분리에 대한 설명으로 옳지 않은 것은?",
["물리적 망분리는 업무망과 인터넷망을 별도의 PC와 네트워크로 완전히 분리하는 방식이다.","논리적 망분리는 가상화(VDI, CBC/SBC 등) 기술로 하나의 PC에서 업무 영역과 인터넷 영역을 분리한다.","개인정보 다운로드·파기 또는 접근권한 설정이 가능한 개인정보취급자의 컴퓨터는 인터넷망 차단 조치 대상이 될 수 있다.","망분리를 적용하면 모든 보안 위협이 제거되므로 다른 안전조치는 불필요하다.","망분리 환경에서도 자료 전송 구간에 대한 통제(망연계 솔루션 등)가 필요하다."],
3,"망분리는 인터넷 경유 침해 위협을 줄이지만 내부자 위협, 보조저장매체, 망연계 구간 등 다른 위험은 남으므로 접근통제·암호화·접속기록 등 안전조치가 병행되어야 한다.","네트워크"],
[4,"악성프로그램 등 방지 조치에 대한 설명으로 옳지 않은 것은?",

[4,"물리적 안전조치에 대한 설명으로 옳지 않은 것은?",
["전산실, 자료보관실 등 개인정보 보관 장소에 대한 출입통제 절차를 수립·운영한다.","개인정보가 포함된 서류, 보조저장매체 등을 잠금장치가 있는 안전한 장소에 보관한다.","개인정보가 포함된 보조저장매체의 반출·입 통제를 위한 보안대책을 마련한다.","출입통제 기록은 보관하지 않아도 된다.","보조저장매체 반출입 통제는 별도의 개인정보처리시스템을 운영하지 않는 경우 등 일부 완화될 수 있다."],
3,"출입 권한 부여 및 출입 기록 관리는 물리적 안전조치의 기본이다. 출입통제 절차에는 출입 기록 보관·점검이 포함된다.","물리적"],
[4,"재해·재난 대비 안전조치 및 백업에 대한 설명으로 옳지 않은 것은?",
["화재, 홍수, 단전 등 재해·재난 발생 시 개인정보처리시스템 보호를 위한 위기대응 매뉴얼 등 대응절차를 마련하고 정기적으로 점검한다.","개인정보처리시스템의 백업 및 복구를 위한 계획을 마련한다.","백업 데이터는 원본 서버와 동일한 서버·장소에 보관하는 것이 가장 안전하다.","백업 매체에 포함된 개인정보도 암호화 등 안전조치 대상이다.","재해·재난 대비 조치는 일정 규모 이상의 개인정보처리자에게 요구된다."],
2,"백업은 원본과 물리적으로 분리된 장소(원격지 등)에 보관하여 동일 재해로 함께 손실되지 않도록 해야 한다.","재해재난"],
[4,"개인정보의 출력·복사 시 안전조치에 대한 설명으로 옳지 않은 것은?",
["개인정보를 종이로 출력하거나 복사하는 경우 용도를 특정하고 용도에 따라 출력 항목을 최소화한다.","화면에 표시할 때 주민등록번호 뒷자리 등 불필요한 부분을 마스킹 처리한다.","개인정보가 포함된 종이 인쇄물, 외부 저장매체 등의 유출 방지를 위한 보호조치를 한다.","출력·복사된 개인정보는 보호조치 없이 자유롭게 반출할 수 있다.","개인정보 다운로드 시 사유 확인 및 내역 기록이 필요하다."],

3,"일반 삭제·휴지통 비우기는 복구 가능하므로 파기로 인정되지 않는다. 복원 불가능한 영구 삭제(덮어쓰기, 로우레벨 포맷, 디가우징, 물리적 파쇄)가 필요하다.","파기"],

["개인정보처리자는 업무를 목적으로 개인정보파일을 운용하는 공공기관, 법인, 단체 및 개인이다.","개인정보취급자는 개인정보처리자의 지휘·감독을 받아 개인정보를 처리하는 임직원, 파견근로자, 시간제근로자 등이다.","개인정보취급자는 반드시 정규직 직원이어야 한다.","개인정보처리자는 개인정보취급자에 대하여 적절한 관리·감독을 하여야 한다.","개인정보처리자는 개인정보취급자에게 정기적으로 필요한 교육을 실시하여야 한다."],
2,"법 제28조. 개인정보취급자에는 파견근로자, 시간제근로자 등 고용 형태와 관계없이 처리자의 지휘·감독 하에 개인정보를 처리하는 자가 모두 포함된다.","정의"],
[4,"개인정보처리시스템에 접속한 취급자가 일정 시간 업무를 처리하지 않을 때 자동으로 접속을 차단하는 조치(세션 타임아웃)는 어느 안전조치 영역에 해당하는가?",

["TLS(HTTPS) 적용","VPN을 통한 암호화 터널","전용선 이용","평문 FTP를 통한 파일 전송","SFTP 등 암호화 전송 프로토콜 사용"],
3,"FTP·Telnet·HTTP 등 평문 프로토콜은 스니핑에 취약하다. 개인정보 송수신 시 TLS, VPN, SFTP 등 암호화 통신을 적용하여야 한다.","전송보호"],
[4,"공개키 기반구조(PKI)에서 인증서의 폐지(revocation) 여부를 확인하는 수단으로 옳은 것은?",
["CRL(인증서 폐지 목록) 또는 OCSP","CA의 공개키","해시 함수","대칭키 교환","전자서명 생성키"],

[4,"SQL Injection 공격을 예방하기 위한 가장 근본적인 대응 방법은?",
["에러 메시지를 상세하게 출력한다.","Prepared Statement(파라미터 바인딩)를 사용하고 입력값을 검증한다.","DB 계정에 최대 권한을 부여한다.","웹 서버의 로그 기록을 비활성화한다.","모든 입력값을 그대로 쿼리 문자열에 연결한다."],
1,"입력값을 쿼리와 분리하는 Prepared Statement와 입력값 검증(화이트리스트)이 핵심이며, DB 계정 최소 권한, 에러 메시지 비노출, WAF 적용이 보조 수단이다.","시큐어코딩"],
[4,"웹 취약점에 대한 설명으로 옳지 않은 것은?",
["XSS(크로스 사이트 스크립팅)는 악성 스크립트를 삽입하여 다른 사용자의 브라우저에서 실행시키는 공격이다.","CSRF는 인증된 사용자의 권한으로 공격자가 의도한 요청을 위조하여 전송시키는 공격이다.","XSS 대응으로 출력값 인코딩(이스케이프)과 입력값 검증을 적용한다.","CSRF 대응으로 요청마다 예측 불가능한 토큰을 검증한다.","XSS는 서버의 DB를 직접 변조하는 공격이므로 DB 암호화로 방어한다."],
4,"XSS는 클라이언트(브라우저)에서 스크립트가 실행되어 쿠키·세션 탈취 등을 유발하는 공격이다. DB 암호화와는 무관하며 입출력 검증·인코딩, HttpOnly 쿠키 등으로 대응한다.","시큐어코딩"],

["접속기록을 별도의 물리적 저장장치에 보관한다.","접속기록을 정기적으로 백업한다.","접속기록에 대한 접근 권한을 최소화한다.","개인정보취급자가 자신의 접속기록을 직접 수정·삭제할 수 있도록 한다.","WORM 저장매체나 해시값 등으로 무결성을 검증한다."],
3,"취급자가 본인 기록을 수정할 수 있으면 접속기록의 증거 가치가 상실된다. 기록 저장소는 취급자가 접근할 수 없는 별도 시스템에 두고 무결성 검증을 적용해야 한다.","접속기록"],
[4,"백업·복구 계획에서 RPO(Recovery Point Objective)의 의미로 옳은 것은?",
["장애 발생 후 서비스가 복구되어야 하는 목표 시간","장애 발생 시 허용되는 최대 데이터 손실 시점(복구 목표 시점)","백업 매체의 물리적 보관 기간","연간 예상 손실액","시스템 가동률 목표"],
1,"RPO는 장애 시 어느 시점까지의 데이터를 복구할 것인지(허용 데이터 손실 범위), RTO는 복구까지 허용되는 목표 시간이다.","재해복구"],
[4,"클라우드 서비스를 이용하여 개인정보를 처리하는 경우에 대한 설명으로 옳지 않은 것은?",
["클라우드 사업자에게 개인정보 처리를 위탁하는 경우 제26조에 따른 위탁 문서 작성·공개 등이 필요하다.","개인정보처리자는 클라우드 환경에서도 접근통제·암호화·접속기록 등 안전조치 의무를 부담한다.","클라우드 이용 시 안전조치 책임은 전적으로 클라우드 사업자에게 있다.","해외 리전에 개인정보를 저장하는 경우 국외 이전 요건을 검토하여야 한다.","책임 공유 모델에 따라 서비스 유형(IaaS/PaaS/SaaS)별로 이용자와 사업자의 보안 책임 범위가 달라진다."],
2,"클라우드를 이용하더라도 개인정보처리자의 법적 책임은 유지되며, 사업자와 책임을 공유한다. 계약·SLA에 보안 요건을 명시하고 수탁자 관리·감독을 수행해야 한다.","클라우드"],
[4,"쿠키 등 인터넷 접속정보파일을 자동으로 수집하는 장치의 운영에 대한 설명으로 옳지 않은 것은?",
["개인정보 처리방침에 자동 수집 장치의 설치·운영 및 그 거부에 관한 사항을 기재하여야 한다.","이용자는 브라우저 설정을 통해 쿠키 저장을 거부할 수 있다.","쿠키를 통해 수집된 정보가 다른 정보와 결합하여 개인을 식별할 수 있다면 개인정보로 취급한다.","쿠키는 어떠한 경우에도 개인정보가 될 수 없다.","맞춤형 광고 등을 위한 행태정보 수집 시 수집 사실과 거부 방법을 이용자가 알 수 있게 해야 한다."],
3,"쿠키 ID, 광고 ID 등 온라인 식별자도 다른 정보와 쉽게 결합하여 개인을 알아볼 수 있으면 개인정보에 해당할 수 있다.","쿠키"],
[4,"스마트폰 앱의 접근권한(「정보통신망법」 제22조의2)에 대한 설명으로 옳지 않은 것은?",
["서비스 제공에 반드시 필요한 접근권한(필수)과 그렇지 않은 접근권한(선택)을 구분하여 알리고 동의를 받아야 한다.","접근권한이 필요한 항목과 그 이유를 알려야 한다.","이용자가 선택적 접근권한에 동의하지 않아도 서비스 제공을 거부하여서는 아니 된다.","앱 설치 시 모든 접근권한을 일괄 필수로 지정하여 동의받을 수 있다.","접근권한 동의는 운영체제의 권한 설정 기능 등을 통해 받을 수 있다."],
3,"접근권한은 필수·선택을 구분하여야 하며 서비스 제공과 무관한 권한을 필수로 지정할 수 없다.","앱접근권한"],
[4,"개인정보 유출 사고가 발생한 것으로 확인된 직후 가장 먼저 수행해야 할 조치로 적절한 것은?",
["모든 로그를 삭제하여 시스템을 초기화한다.","추가 유출을 차단하기 위한 긴급 조치(접근 차단, 계정 정지 등)를 하고 증거를 보존한다.","언론에 먼저 보도자료를 배포한다.","유출 원인 분석이 끝난 후 1개월 뒤 정보주체에게 통지한다.","담당 직원을 징계한다."],
1,"사고 대응은 인지·접수 → 초동조치(차단·증거보존) → 분석 → 72시간 내 통지·신고 → 복구 → 재발방지 순으로 진행한다. 로그 삭제는 증거 훼손이며, 통지·신고를 지연하면 법 위반이다.","사고대응"],
[4,"한 사람이 개발과 운영, 권한 부여와 승인 등을 동시에 수행하지 못하도록 업무를 나누는 보안 원칙은?",
["최소 권한 원칙","직무 분리(Separation of Duties)","심층 방어(Defense in Depth)","알 필요성(Need to know)","기본 거부(Default deny)"],
1,"직무 분리는 단일 담당자의 오남용·부정을 방지한다. 최소 권한은 업무에 필요한 최소 권한만 부여하는 원칙으로 함께 적용된다.","보안원칙"],
[4,"생체인식정보에 대한 설명으로 옳지 않은 것은?",
["특정 개인을 알아볼 목적으로 일정한 기술적 수단을 통해 생성한 신체적·생리적·행동적 특징 정보는 민감정보에 해당한다.","생체인식정보는 저장 시 암호화하여야 한다.","생체인식정보는 유출되더라도 비밀번호처럼 즉시 변경할 수 있어 위험이 낮다.","원본 정보(얼굴 사진 등)와 특징정보(템플릿)는 분리 보관하는 것이 바람직하다.","생체인식정보 처리 시 별도 동의 등 민감정보 처리 요건을 갖추어야 한다."],
2,"생체정보는 변경이 불가능하므로 유출 시 피해가 영구적이다. 따라서 템플릿 암호화·분리 보관 등 높은 수준의 보호가 필요하다.","생체정보"],
[4,"영상정보처리기기로 수집한 개인영상정보의 관리에 대한 설명으로 옳지 않은 것은?",
["보관 기간이 만료되면 지체 없이 파기하여야 한다.","개인영상정보에 대한 접근 권한을 최소한의 인원으로 제한한다.","개인영상정보를 반출하는 경우 반출 일시·목적·대상 등을 기록·관리한다.","정보주체의 열람 요구 시 다른 사람의 영상을 모자이크 처리 없이 그대로 제공한다.","영상정보처리기기 운영·관리 방침을 마련하여야 한다."],
3,"열람 제공 시 제3자의 사생활 침해를 방지하기 위해 다른 사람의 영상은 모자이크 등 보호조치를 하여야 한다. 표준 가이드라인은 보관기간 30일 이내를 권장한다.","영상정보"],

// ───────────── 5과목 개인정보 관리체계 ─────────────
[5,"정보보호 및 개인정보보호 관리체계(ISMS-P) 인증에 대한 설명으로 옳지 않은 것은?",
["과학기술정보통신부와 개인정보 보호위원회가 공동으로 고시한다.","인증기관은 한국인터넷진흥원(KISA)과 금융보안원이다.","인증 유효기간은 3년이다.","인증 취득 후 유효기간 중 매년 1회 이상 사후심사를 받아야 한다.","인증 유효기간은 5년이며 사후심사는 2년마다 받는다."],
4,"ISMS-P 유효기간은 3년, 사후심사는 연 1회 이상, 유효기간 만료 전 갱신심사를 받아야 한다. 심사기관으로 KAIT, TTA, OPA, NISC 등이 지정되어 있다.","ISMS-P"],
[5,"ISMS 인증 의무대상에 대한 설명으로 옳지 않은 것은?",
["「전기통신사업법」에 따른 등록을 한 자로서 서울 및 모든 광역시에서 정보통신망서비스를 제공하는 자(ISP)","집적정보통신시설 사업자(IDC)","연간 매출액 또는 세입이 1,500억원 이상인 상급종합병원","연간 매출액 또는 세입이 1,500억원 이상이고 재학생 수가 5천명 이상인 학교","정보통신서비스 부문 전년도 매출액 100억원 이상 또는 전년도 말 기준 직전 3개월간 일일평균 이용자 수 100만명 이상인 자"],
3,"학교의 의무대상 기준은 연간 매출액·세입 1,500억원 이상이면서 '재학생 수 1만명 이상'이다.","ISMS-P"],
[5,"ISMS-P 인증기준의 구성으로 옳은 것은?",
["관리체계 수립 및 운영, 보호대책 요구사항, 개인정보 처리단계별 요구사항","위험평가, 보호대책, 사후관리","수집, 보유, 이용, 파기","기술적·관리적·물리적 보호조치","정책, 조직, 자산관리"],
0,"ISMS-P는 ①관리체계 수립 및 운영(16개) ②보호대책 요구사항(64개) ③개인정보 처리단계별 요구사항(21개)으로 구성된다. ISMS만 받는 경우 ①+② 80개 기준이 적용된다.","ISMS-P"],
[5,"ISMS-P '관리체계 수립 및 운영' 영역의 4개 분야에 해당하지 않는 것은?",
["관리체계 기반 마련","위험 관리","관리체계 운영","관리체계 점검 및 개선","암호화 적용"],
4,"1.1 관리체계 기반 마련, 1.2 위험 관리, 1.3 관리체계 운영, 1.4 관리체계 점검 및 개선의 4개 분야 16개 항목이다. 암호화 적용은 보호대책 요구사항(2.7)이다.","ISMS-P"],
[5,"정보보호 위험(Risk)의 구성 요소에 대한 설명으로 옳지 않은 것은?",
["위험은 자산, 위협, 취약성의 함수로 표현된다.","자산은 조직이 보호해야 할 가치 있는 정보·시스템·인력 등이다.","위협은 자산에 손실을 초래할 수 있는 잠재적 원인이나 사건이다.","취약성은 위협이 악용할 수 있는 자산의 약점이다.","취약성이 없어도 위협만 존재하면 위험은 발생한다."],
4,"위험은 위협이 취약성을 악용하여 자산에 피해를 줄 가능성이다. 취약성이 없으면 위협이 실현될 수 없어 위험이 성립하지 않는다.","위험관리"],
[5,"위험 처리 전략 중 사이버보험 가입이나 아웃소싱을 통해 위험에 따른 손실을 제3자에게 넘기는 방식은?",
["위험 감소(Mitigation)","위험 회피(Avoidance)","위험 전가(Transfer)","위험 수용(Acceptance)","위험 무시"],
2,"위험 처리 전략은 감소(통제 적용), 회피(위험 활동 중단), 전가(보험·계약), 수용(비용 대비 효과 고려하여 감내) 4가지이다.","위험관리"],
[5,"위험관리에서 DoA(Degree of Assurance, 수용 가능한 위험 수준)에 대한 설명으로 옳은 것은?",
["조직이 감내할 수 있는 위험의 목표 수준으로, 경영진이 결정·승인한다.","모든 위험을 0으로 만드는 수준이다.","외부 감사인이 일방적으로 정한다.","자산의 총 가치를 의미한다.","위협 발생 빈도를 의미한다."],
0,"DoA는 위험평가 결과 중 어느 수준까지 수용할지를 정하는 기준이며, 경영진의 승인을 받아야 한다. DoA를 초과하는 위험은 보호대책을 적용한다.","위험관리"],
[5,"위험분석 접근법 중 베이스라인(기준선) 접근법의 특징으로 옳지 않은 것은?",
["표준이나 모범사례의 통제 항목을 일괄 적용한다.","분석 시간과 비용이 적게 든다.","조직의 특성을 세밀하게 반영하기 어렵다.","과다 또는 과소 보호가 발생할 수 있다.","자산별로 상세한 위험 계산을 수행하므로 가장 정확하다."],
4,"상세 위험분석은 자산·위협·취약성을 개별 분석하여 정확하지만 비용이 크다. 베이스라인은 간편하지만 정밀도가 낮으며, 복합 접근법은 핵심 자산만 상세 분석한다.","위험관리"],
[5,"정량적 위험분석에서 단일 손실 예상액(SLE)이 1억원, 연간 발생률(ARO)이 0.2인 경우 연간 손실 예상액(ALE)은?",
["1,000만원","2,000만원","5,000만원","1억원","5억원"],
1,"ALE = SLE × ARO = 1억원 × 0.2 = 2,000만원. 정량적 분석은 금액으로 표현되어 비용 대비 효과 분석에 유용하지만 산정이 어렵다.","위험관리"],
[5,"정성적 위험분석 기법 중 전문가 집단의 의견을 익명으로 반복 수렴하여 합의에 도달하는 방법은?",
["델파이(Delphi) 기법","시나리오 분석","순위 결정법","몬테카를로 시뮬레이션","연간 손실 예상액 분석"],
0,"델파이는 전문가 설문을 반복하여 의견을 수렴하는 정성적 기법이다. 몬테카를로·ALE는 정량적 기법에 가깝다.","위험관리"],
[5,"관리체계 PDCA 사이클에서 내부감사, 모니터링, 관리체계 점검이 수행되는 단계는?",
["Plan","Do","Check","Act","Review"],
2,"Plan(계획 수립) → Do(구현·운영) → Check(모니터링·점검·내부감사) → Act(시정·개선) 순환으로 관리체계를 지속적으로 개선한다.","PDCA"],
[5,"개인정보 보호책임자(CPO)의 업무(제31조 제3항)에 해당하지 않는 것은?",
["개인정보 보호 계획의 수립 및 시행","개인정보 처리 실태 및 관행의 정기적인 조사 및 개선","개인정보 처리와 관련한 불만의 처리 및 피해 구제","개인정보 유출 및 오용·남용 방지를 위한 내부통제시스템의 구축","개인정보 처리시스템 서버 하드웨어의 구매 계약 체결"],
4,"CPO 업무: 계획 수립·시행, 실태·관행 조사·개선, 불만 처리·피해 구제, 내부통제시스템 구축, 교육 계획 수립·시행, 개인정보파일 보호·관리·감독, 처리방침 수립·변경·시행, 관련 자료 관리, 파기 등이다.","CPO"],
[5,"개인정보 보호책임자의 지위와 독립성에 대한 설명으로 옳지 않은 것은?",
["개인정보처리자는 CPO가 업무를 수행함에 있어 정당한 이유 없이 불이익을 주거나 받게 하여서는 아니 된다.","일정 기준의 개인정보처리자는 CPO가 이해충돌 우려가 있는 업무를 겸직하지 않도록 하여야 한다.","CPO는 개인정보 보호 관련 사항을 대표자 및 이사회에 보고할 수 있어야 한다.","CPO는 업무 수행과 관련하여 개인정보처리자로부터 불이익을 받을 수 있다.","공공기관의 CPO는 소속 기관의 규모에 따라 고위공무원 등 일정 직급 이상으로 지정한다."],
3,"제31조 제6항은 CPO에 대한 불이익 금지를 규정하며, 2026년 개정으로 전문인력·예산 권한과 이사회 보고 의무가 추가되어 독립성이 강화되었다.","CPO"],
[5,"개인정보 손해배상책임 보장(제39조의7) 의무 대상 기준으로 옳은 것은?",
["전년도 매출액 10억원 이상이고, 전년도 말 기준 직전 3개월간 저장·관리되는 정보주체 수가 일일평균 1만명 이상인 자","전년도 매출액 100억원 이상이고 정보주체 100만명 이상인 자","모든 개인정보처리자","공공기관만 대상","정보주체 1천명 이상 보유한 모든 사업자"],
0,"시행령 제48조의7. 보험·공제 가입 또는 준비금 적립 의무가 있으며, 공공기관·비영리법인·소상공인(일정 조건) 등은 제외된다. 최저가입금액은 정보주체 수와 매출액에 따라 차등된다.","손해배상보장"],
[5,"개인정보 영향평가서의 보호위원회 제출 기한과 이행점검확인서 제출 기한으로 옳은 것은?",
["영향평가서는 평가 완료 후 2개월 이내, 이행점검확인서는 영향평가서 제출 후 1년 이내","영향평가서는 평가 완료 후 6개월 이내, 이행점검확인서는 2년 이내","영향평가서는 평가 완료 즉시, 이행점검확인서는 6개월 이내","영향평가서는 1년 이내, 이행점검확인서는 제출 의무 없음","영향평가서와 이행점검확인서 모두 3개월 이내"],
0,"시행령 제38조. 영향평가서는 평가 완료 후 2개월 이내 보호위원회에 제출하고, 개선사항 이행 결과를 담은 이행점검확인서는 1년 이내에 제출한다.","영향평가"],
[5,"개인정보 영향평가 수행 절차에 대한 설명으로 옳지 않은 것은?",
["사전준비 단계에서 사업계획을 수립하고 평가기관을 선정한다.","평가수행 단계에서 개인정보 흐름 분석과 침해요인 분석을 수행하고 개선계획을 수립한다.","이행 단계에서 영향평가서를 보호위원회에 제출하고 개선사항 이행을 점검한다.","영향평가는 개인정보처리시스템 구축·운영 후가 아닌 설계·구축 단계에서 수행하는 것이 원칙이다.","영향평가 결과는 개인정보파일 등록과 무관하다."],
4,"공공기관이 영향평가를 한 개인정보파일을 등록할 때는 영향평가 결과를 함께 첨부하여야 한다(제33조 제5항).","영향평가"],
[5,"ISMS-P 인증심사의 종류에 대한 설명으로 옳지 않은 것은?",
["최초심사는 인증을 처음 취득할 때 받는 심사이다.","사후심사는 인증 유효기간 중 매년 1회 이상 받는 심사이다.","갱신심사는 유효기간 만료 전에 인증을 연장하기 위해 받는 심사이다.","사후심사는 2년에 1회 받는다.","인증 범위에 중대한 변경이 있으면 변경 심사를 받을 수 있다."],
3,"사후심사는 유효기간(3년) 동안 연 1회 이상 받아야 한다.","ISMS-P"],
[5,"ISMS-P 인증심사원 등급에 해당하지 않는 것은?",
["심사원보","심사원","선임심사원","책임심사원","수석심사원"],
4,"ISMS-P 인증심사원은 심사원보 → 심사원 → 선임심사원 → 책임심사원의 4등급으로 운영된다.","ISMS-P"],
[5,"「개인정보 보호법」 제11조의2에 따라 공공기관의 개인정보 보호수준 평가를 실시하는 주체는?",
["개인정보 보호위원회","행정안전부장관","감사원","국가정보원","한국인터넷진흥원장"],
0,"2023년 개정으로 기존 '관리수준 진단'이 법정 '보호수준 평가'로 격상되었다. 보호위원회가 공공기관의 개인정보 보호 정책·업무 수행 실적을 평가하고 결과를 공개·개선 권고할 수 있다.","공공기관평가"],
[5,"2026년 개정 「개인정보 보호법」의 개인정보 보호 인증 의무화에 대한 설명으로 옳지 않은 것은?",
["매출액과 개인정보 처리 규모가 일정 기준에 이르는 개인정보처리자는 보호위원회의 개인정보 보호 인증을 받아야 한다.","의무 인증 제도는 개인정보 관리체계의 신뢰성과 안전성을 높이기 위한 것이다.","인증 의무를 이행하지 않으면 과태료가 부과될 수 있다.","인증 의무화 규정은 2026년 9월 11일부터 시행된다.","인증 의무화 대상 기준은 대통령령으로 정한다."],
3,"인증 의무화(제32조의2) 및 관련 과태료 규정은 준비기간을 고려하여 2027년 7월 1일부터 시행된다. 그 외 개정 규정은 2026년 9월 11일 시행이다.","2026개정"]
];

</script>
<script>
(function(){
const Q = window.CPPG_QUESTIONS.map((x,i)=>({id:i, s:x[0], q:x[1], o:x[2], a:x[3], e:x[4], t:x[5]}));
const SUBJ = window.CPPG_SUBJECTS;
const KEY='cppg_v1';
const PASS_SUBJ=0.4, PASS_TOTAL=0.6;

// ---------- state ----------
let S = load();
function load(){ try{const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){} return {stats:{},history:[],marks:[],exam:""}; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function st(id){ return S.stats[id] || (S.stats[id]={seen:0,ok:0,ng:0,box:0,streak:0,last:0}); }
function record(id, correct){
  const s=st(id); s.seen++; s.last=Date.now();
  if(correct){ s.ok++; s.streak++; s.box=Math.min(4,s.box+1); }
  else { s.ng++; s.streak=0; s.box=0; }
  save();
}

// ---------- utils ----------
const $=sel=>document.querySelector(sel);
const app=$('#app');
function h(str){ return String(str).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function pct(a,b){ return b? Math.round(a/b*100):0; }
function subjName(s){ return SUBJ.find(x=>x.id===s).name; }
function circ(i){ return ['①','②','③','④','⑤'][i]; }

// 우선순위: 미출제 > 틀린 적 있고 box 낮음 > 오래 전 학습
function pick(pool, n){
  const scored = pool.map(q=>{ const s=S.stats[q.id]; let w;
    if(!s) w=1000+Math.random()*100;
    else w = (4-s.box)*200 + (s.ng>s.ok?150:0) + Math.min(100,(Date.now()-s.last)/864e5*10) + Math.random()*60;
    return {q,w}; });
  scored.sort((a,b)=>b.w-a.w);
  return scored.slice(0,n).map(x=>x.q);
}
function wrongPool(){ return Q.filter(q=>{const s=S.stats[q.id]; return s && s.ng>0 && s.box<3;}); }

// ---------- views ----------
let view='home', session=null;
document.getElementById('nav').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; if(session && !session.finished && !confirmLeave()) return; go(b.dataset.view); });
function confirmLeave(){ return true; } // 세션은 홈으로 가도 유지되며 '학습 시작' 화면에서 재개 가능
function go(v){ view=v; document.querySelectorAll('#nav .pill').forEach(b=>b.toggleAttribute('aria-current',false)); const cur=document.querySelector(`#nav [data-view="${v}"]`); if(cur) cur.setAttribute('aria-current','page'); render(); window.scrollTo({top:0}); }

function render(){
  app.innerHTML='';
  ({home,setup,quiz,result,wrong,history,settings})[view]();
}

function dday(){
  if(!S.exam) return '';
  const d=Math.ceil((new Date(S.exam+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5);
  return d>0?`D-${d}`:(d===0?'D-Day':'시험 종료');
}

function home(){
  const seen=Object.keys(S.stats).length, ok=Object.values(S.stats).reduce((a,s)=>a+s.ok,0), tot=Object.values(S.stats).reduce((a,s)=>a+s.seen,0);
  const wp=wrongPool().length, mastered=Object.values(S.stats).filter(s=>s.box>=3).length;
  const last=S.history.filter(x=>x.mode==='mock').slice(-1)[0];
  app.innerHTML=`
  <div class="fade">
    <div class="row" style="justify-content:space-between">
      <div><div class="label">CPPG · 개인정보관리사</div>
      <h1>12월 시험까지, 틀린 문제가<br>0개가 될 때까지</h1></div>
      <div class="card" style="min-width:200px;padding:16px 24px"><div class="muted" style="font-size:14px">시험일</div>
        <div class="dday">${S.exam? h(S.exam)+' · '+dday() : '<button class="pill" data-go="settings">날짜 설정</button>'}</div></div>
    </div>
    <div class="grid g3" style="margin-top:32px">
      <div class="card stat"><div class="num">${seen}<span class="muted" style="font-size:20px">/${Q.length}</span></div><div class="cap">풀어본 문항</div></div>
      <div class="card stat"><div class="num"><b>${pct(ok,tot)}</b>%</div><div class="cap">누적 정답률 (${ok}/${tot})</div></div>
      <div class="card stat"><div class="num">${wp}</div><div class="cap">복습 대기 오답 · 숙달 ${mastered}문항</div></div>
    </div>
    <div class="sec">
      <div class="row">
        <button class="btn" data-start="daily">오늘의 20문항 (추천)</button>
        <button class="btn ghost" data-start="mock">실전 모의고사 100문항</button>
        <button class="btn ghost" data-start="wrong" ${wp?'':'disabled'}>오답만 다시 풀기 (${wp})</button>
        ${session&&!session.finished?`<button class="btn ghost" data-go="quiz">진행 중인 학습 이어하기 →</button>`:''}
      </div>
      <div class="card">
        <h3 style="margin-bottom:8px">과목별 숙련도</h3>
        <div class="muted" style="font-size:14px;margin-bottom:8px">실제 시험 배점: 10 / 20 / 25 / 30 / 15 문항 · 합격 기준: 과목별 40% 이상 & 총점 60% 이상</div>
        ${SUBJ.map(s=>{ const qs=Q.filter(q=>q.s===s.id); let ok=0,t=0,done=0; qs.forEach(q=>{const x=S.stats[q.id]; if(x){done++;ok+=x.ok;t+=x.seen;}});
          const p=pct(ok,t); return `<div class="subj"><div><b>${s.id}과목 ${h(s.name)}</b> <span class="chip">${s.n}문항 출제</span></div>
          <div class="muted" style="font-variant-numeric:tabular-nums">${done}/${qs.length} 학습 · 정답률 ${t?p+'%':'-'}</div>
          <div class="bar"><i class="${p>=60?'ok':''}" style="width:${t?p:0}%"></i></div></div>`;}).join('')}
      </div>
      ${last?`<div class="card"><h3>최근 모의고사</h3><p class="muted" style="margin:4px 0 0">${h(last.date)} · ${last.score}점 · ${last.pass?'<span class="chip ok">합격 기준 충족</span>':'<span class="chip bad">기준 미달</span>'}</p></div>`:''}
      <p class="notice">출제 범위는 한국CPO포럼 공개 출제기준(5과목·100문항·120분·5지선다)을 따르고, 2026.9.11 시행 개정 「개인정보 보호법」(대표자 책임·CPO 권한, 유출등 범위 확대, 매출 10% 과징금, 인증 의무화 2027.7.1)과 2026.8.20 시행 시행령(전송요구권 전 분야 확대)을 반영한 예상문제입니다. 실제 기출문제는 비공개이므로 출제 유형과 빈출 조문 기준으로 구성했습니다.</p>
    </div>
  </div>`;
}

function setup(){
  app.innerHTML=`<div class="fade">
    <div class="label">학습 시작</div><h2 style="margin-top:4px">어떻게 풀까요?</h2>
    ${session&&!session.finished?`<div class="card" style="margin-top:24px"><div class="row" style="justify-content:space-between"><div><b>진행 중인 학습</b> <span class="muted">${h(session.title)} · ${session.idx+1}/${session.items.length}</span></div><div class="row"><button class="btn sm" data-go="quiz">이어하기</button><button class="btn ghost sm" data-act="discard">버리기</button></div></div></div>`:''}
    <div class="grid g2" style="margin-top:24px">
      <div class="card">
        <h3>과목별 학습</h3><p class="muted" style="margin:4px 0 16px">한 문제 풀 때마다 바로 정답·해설을 확인합니다. 아직 안 푼 문제와 틀린 문제가 먼저 나옵니다.</p>
        <div class="row">
          <select id="subjSel"><option value="0">전 과목</option>${SUBJ.map(s=>`<option value="${s.id}">${s.id}과목 ${h(s.name)}</option>`).join('')}</select>
          <select id="cntSel"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
          <span class="muted">문항</span>
        </div>
        <div style="margin-top:16px"><button class="btn" data-start="study">시작</button></div>
      </div>
      <div class="card">
        <h3>실전 모의고사</h3><p class="muted" style="margin:4px 0 16px">실제 배점(10·20·25·30·15)으로 100문항, 120분. 끝까지 푼 뒤 과목별 과락 여부와 함께 채점합니다.</p>
        <div class="row"><button class="btn" data-start="mock">모의고사 시작</button><button class="btn ghost" data-start="mini">미니 모의고사 50문항 · 60분</button></div>
      </div>
      <div class="card">
        <h3>오답 반복</h3><p class="muted" style="margin:4px 0 16px">틀린 문제는 3회 연속 정답이 될 때까지 복습 대기열에 남습니다. 현재 ${wrongPool().length}문항.</p>
        <button class="btn" data-start="wrong" ${wrongPool().length?'':'disabled'}>오답만 풀기</button>
      </div>
      <div class="card">
        <h3>표시한 문제</h3><p class="muted" style="margin:4px 0 16px">풀다가 별표로 표시한 문제만 모아서 풉니다. 현재 ${S.marks.length}문항.</p>
        <button class="btn" data-start="marks" ${S.marks.length?'':'disabled'}>표시한 문제 풀기</button>
      </div>
    </div></div>`;
}

function startSession(kind){
  let items=[], title='', mode='study', limit=0;
  if(kind==='study'){ const s=+($('#subjSel')?.value||0), n=+($('#cntSel')?.value||20); const pool=s?Q.filter(q=>q.s===s):Q; items=pick(pool,n); title=(s?subjName(s):'전 과목')+' 학습'; }
  else if(kind==='daily'){ items=pick(Q,20); title='오늘의 20문항'; }
  else if(kind==='wrong'){ items=shuffle(wrongPool()).slice(0,30); title='오답 반복'; }
  else if(kind==='marks'){ items=shuffle(Q.filter(q=>S.marks.includes(q.id))); title='표시한 문제'; }
  else if(kind==='mock'||kind==='mini'){ mode='mock'; const half=kind==='mini'; limit=(half?60:120)*60;
    SUBJ.forEach(s=>{ const n=half?Math.round(s.n/2):s.n; items=items.concat(pick(Q.filter(q=>q.s===s.id),n)); });
    title=half?'미니 모의고사':'실전 모의고사'; }
  if(!items.length){ toast('풀 문제가 없습니다'); return; }
  // 선택지 섞기(정답 위치 기억 방지)
  items=items.map(q=>{ const order=shuffle([0,1,2,3,4]); return {q,order,ans:null,marked:S.marks.includes(q.id)}; });
  session={kind,mode,title,items,idx:0,finished:false,start:Date.now(),limit,end:limit?Date.now()+limit*1000:0};
  go('quiz');
}

let tick=null;
function quiz(){
  clearInterval(tick);
  if(!session){ go('setup'); return; }
  const it=session.items[session.idx], q=it.q, isMock=session.mode==='mock';
  const answered=it.ans!==null;
  const showFb = !isMock && answered;
  app.innerHTML=`<div class="fade">
    <div class="qhead">
      <div><span class="label">${h(session.title)}</span> <span class="chip">${q.s}과목 ${h(subjName(q.s))}</span> <span class="chip">${h(q.t)}</span></div>
      <div class="row">${isMock?`<div class="timer" id="timer"></div>`:''}<span class="muted" style="font-variant-numeric:tabular-nums">${session.idx+1} / ${session.items.length}</span></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="qtext">${session.idx+1}. ${h(q.q)}</div>
      <div class="opts" id="opts">${it.order.map((oi,k)=>{
        let cls='opt'; if(showFb){ if(oi===q.a) cls+=' ok'; else if(it.ans===oi) cls+=' bad'; } else if(it.ans===oi) cls+=' sel';
        return `<button class="${cls}" data-o="${oi}" ${showFb?'disabled':''}><span class="n">${k+1}</span><span>${h(q.o[oi])}</span></button>`;}).join('')}</div>
      ${showFb?`<div class="explain"><div class="verdict ${it.ans===q.a?'ok':'bad'}">${it.ans===q.a?'정답입니다':'틀렸습니다 — 정답은 '+(it.order.indexOf(q.a)+1)+'번'}</div><div>${h(q.e)}</div></div>`:''}
      <div class="row" style="justify-content:space-between;margin-top:24px">
        <div class="row">
          <button class="pill" data-act="mark" aria-pressed="${it.marked}">${it.marked?'★ 표시됨':'☆ 표시'}</button>
          <span class="kbd">키보드 1~5 선택 · Enter 다음</span>
        </div>
        <div class="row">
          <button class="btn ghost sm" data-act="prev" ${session.idx===0?'disabled':''}>이전</button>
          ${isMock
            ? (session.idx===session.items.length-1?`<button class="btn sm" data-act="submit">제출하고 채점</button>`:`<button class="btn sm" data-act="next">다음</button>`)
            : (showFb?`<button class="btn sm" data-act="next">${session.idx===session.items.length-1?'결과 보기':'다음 문제'}</button>`:`<button class="btn sm" data-act="skip">건너뛰기</button>`)}
        </div>
      </div>
      ${isMock?`<div class="navgrid" id="navgrid">${session.items.map((x,i)=>`<button data-j="${i}" class="${x.ans!==null?'done':''} ${i===session.idx?'cur':''} ${x.marked?'mark':''}">${i+1}</button>`).join('')}</div>
      <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost sm" data-act="submit">지금 제출</button></div>`:''}
    </div></div>`;
  if(isMock){ const t=$('#timer'); const upd=()=>{ const left=Math.max(0,Math.round((session.end-Date.now())/1000)); t.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`; t.classList.toggle('warn',left<600); if(left<=0){ clearInterval(tick); finish(); toast('시간 종료 — 자동 제출'); } }; upd(); tick=setInterval(upd,1000); }
}
function answer(oi){
  const it=session.items[session.idx]; if(session.mode!=='mock' && it.ans!==null) return;
  it.ans=oi;
  if(session.mode!=='mock') record(it.q.id, oi===it.q.a);
  if(session.mode==='mock' && session.idx<session.items.length-1){ session.idx++; }
  render();
}
function next(){ if(session.idx<session.items.length-1){ session.idx++; render(); } else finish(); }
function finish(){
  clearInterval(tick);
  session.finished=true;
  if(session.mode==='mock') session.items.forEach(it=>record(it.q.id, it.ans===it.q.a));
  const total=session.items.length, ok=session.items.filter(it=>it.ans===it.q.a).length;
  const by=SUBJ.map(s=>{ const its=session.items.filter(it=>it.q.s===s.id); const o=its.filter(it=>it.ans===it.q.a).length; return {id:s.id,n:its.length,ok:o,pass:its.length?o/its.length>=PASS_SUBJ:true}; });
  const pass = session.mode==='mock' && ok/total>=PASS_TOTAL && by.every(b=>b.pass);
  S.history.push({date:new Date().toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'}),mode:session.mode,title:session.title,n:total,ok,score:Math.round(ok/total*100),pass,by:by.map(b=>b.ok+'/'+b.n),sec:Math.round((Date.now()-session.start)/1000)});
  if(S.history.length>100) S.history=S.history.slice(-100);
  save(); go('result');
}
function result(){
  if(!session){ go('home'); return; }
  const total=session.items.length, ok=session.items.filter(it=>it.ans===it.q.a).length, isMock=session.mode==='mock';
  const by=SUBJ.map(s=>{ const its=session.items.filter(it=>it.q.s===s.id); const o=its.filter(it=>it.ans===it.q.a).length; return {s,n:its.length,ok:o}; }).filter(b=>b.n);
  const pass= ok/total>=PASS_TOTAL && by.every(b=>b.ok/b.n>=PASS_SUBJ);
  const wrongs=session.items.filter(it=>it.ans!==it.q.a);
  app.innerHTML=`<div class="fade">
    <div class="label">${h(session.title)} 결과</div>
    <div class="grid g3" style="margin-top:16px">
      <div class="card stat"><div class="num"><b>${Math.round(ok/total*100)}</b>점</div><div class="cap">${ok} / ${total} 정답</div></div>
      <div class="card stat"><div class="num">${isMock?(pass?'합격':'미달'):(wrongs.length)}</div><div class="cap">${isMock?'총점 60% + 과목별 40% 기준':'틀린 문항 (복습 대기열에 추가됨)'}</div></div>
      <div class="card stat"><div class="num">${Math.round((Date.now()-session.start)/60000)}<span class="muted" style="font-size:20px">분</span></div><div class="cap">소요 시간</div></div>
    </div>
    <div class="card" style="margin-top:24px"><h3 style="margin-bottom:8px">과목별</h3>
      <table class="res-table"><tr><th>과목</th><th>정답</th><th>정답률</th><th>과락(40%)</th></tr>
      ${by.map(b=>{const p=Math.round(b.ok/b.n*100);return `<tr><td>${b.s.id}과목 ${h(b.s.name)}</td><td>${b.ok}/${b.n}</td><td>${p}%</td><td>${p>=40?'<span class="chip ok">통과</span>':'<span class="chip bad">과락</span>'}</td></tr>`;}).join('')}
      </table></div>
    <div class="row" style="margin-top:24px">
      ${wrongs.length?`<button class="btn" data-act="retryWrong">틀린 ${wrongs.length}문항 바로 다시 풀기</button>`:''}
      <button class="btn ghost" data-start="${session.kind==='study'?'daily':session.kind}">같은 방식으로 한 세트 더</button>
      <button class="btn ghost" data-go="home">홈으로</button>
    </div>
    ${wrongs.length?`<div class="card" style="margin-top:24px"><h3>틀린 문제 해설</h3>${wrongs.map(it=>`<div class="wrongitem"><span class="chip">${it.q.s}과목</span> <span class="chip">${h(it.q.t)}</span><div class="q">${h(it.q.q)}</div>
      ${it.ans!==null?`<div class="a" style="color:var(--bad)">내 답: ${h(it.q.o[it.ans])}</div>`:`<div class="a muted">미응답</div>`}
      <div class="a" style="color:var(--ok)">정답: ${h(it.q.o[it.q.a])}</div><div class="a muted">${h(it.q.e)}</div></div>`).join('')}</div>`:''}
  </div>`;
}
function wrong(){
  const pool=wrongPool().sort((a,b)=>S.stats[b.id].ng-S.stats[a.id].ng);
  app.innerHTML=`<div class="fade"><div class="row" style="justify-content:space-between"><div><div class="label">오답노트</div><h2 style="margin-top:4px">복습 대기 ${pool.length}문항</h2><p class="muted" style="margin:4px 0 0">3회 연속 정답이면 대기열에서 빠집니다. 틀린 횟수가 많은 순서입니다.</p></div>
    <button class="btn" data-start="wrong" ${pool.length?'':'disabled'}>오답만 풀기</button></div>
    ${pool.length?`<div class="card" style="margin-top:24px">${pool.map(q=>{const s=S.stats[q.id];return `<div class="wrongitem"><span class="chip bad">${s.ng}회 오답</span> <span class="chip">${q.s}과목</span> <span class="chip">${h(q.t)}</span> <span class="chip">연속 정답 ${s.streak}/3</span><div class="q">${h(q.q)}</div><div class="a" style="color:var(--ok)">정답: ${h(q.o[q.a])}</div><div class="a muted">${h(q.e)}</div></div>`;}).join('')}</div>`
    :`<div class="card" style="margin-top:24px"><p class="muted" style="margin:0">아직 틀린 문제가 없거나 모두 숙달했습니다. 모의고사로 새로운 문제를 풀어보세요.</p></div>`}
  </div>`;
}
function history(){
  const hs=S.history.slice().reverse();
  app.innerHTML=`<div class="fade"><div class="label">기록</div><h2 style="margin-top:4px">학습 ${S.history.length}회</h2>
  ${hs.length?`<div class="card" style="margin-top:24px;overflow-x:auto"><table class="res-table"><tr><th>일시</th><th>구분</th><th>점수</th><th>정답</th><th>과목별</th><th>시간</th></tr>
  ${hs.map(x=>`<tr><td style="white-space:nowrap">${h(x.date)}</td><td>${h(x.title)}${x.mode==='mock'?(x.pass?' <span class="chip ok">합격</span>':' <span class="chip bad">미달</span>'):''}</td><td><b>${x.score}</b></td><td>${x.ok}/${x.n}</td><td class="muted" style="font-size:13px">${x.by.join(' · ')}</td><td class="muted">${Math.round(x.sec/60)}분</td></tr>`).join('')}</table></div>`
  :`<div class="card" style="margin-top:24px"><p class="muted" style="margin:0">아직 기록이 없습니다.</p></div>`}</div>`;
}
function settings(){
  app.innerHTML=`<div class="fade"><div class="label">설정</div><h2 style="margin-top:4px">시험일과 학습 데이터</h2>
  <div class="grid g2" style="margin-top:24px">
    <div class="card"><h3>시험일</h3><p class="muted" style="margin:4px 0 16px">홈 화면에 D-day가 표시됩니다. 12월 시험 접수 후 확정 날짜를 입력하세요.</p>
      <div class="row"><input type="date" id="examDate" value="${h(S.exam||'')}"><button class="btn sm" data-act="saveDate">저장</button></div></div>
    <div class="card"><h3>학습 데이터 백업</h3><p class="muted" style="margin:4px 0 16px">진도는 이 브라우저에만 저장됩니다. 다른 기기에서 이어서 하려면 아래 텍스트를 복사해 옮기세요.</p>
      <textarea id="dump" readonly>${h(JSON.stringify(S))}</textarea>
      <div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="copy">복사</button></div></div>
    <div class="card"><h3>데이터 불러오기</h3><p class="muted" style="margin:4px 0 16px">백업 텍스트를 붙여넣고 불러오기를 누르면 현재 진도를 대체합니다.</p>
      <textarea id="imp" placeholder='{"stats":...}'></textarea><div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="import">불러오기</button></div></div>
    <div class="card"><h3>초기화</h3><p class="muted" style="margin:4px 0 16px">모든 진도·기록·표시를 삭제합니다. 되돌릴 수 없습니다.</p>
      <div class="row"><button class="btn ghost sm" data-act="resetAsk" id="resetBtn">전체 초기화</button></div></div>
  </div>
  <p class="notice" style="margin-top:32px">문항 수 ${Q.length} · 1과목 ${Q.filter(q=>q.s===1).length} · 2과목 ${Q.filter(q=>q.s===2).length} · 3과목 ${Q.filter(q=>q.s===3).length} · 4과목 ${Q.filter(q=>q.s===4).length} · 5과목 ${Q.filter(q=>q.s===5).length}<br>법령 기준일 2026.10 (개인정보 보호법 2026.9.11 시행분, 시행령 2026.8.20 시행분, 안전성 확보조치 기준 2023.9 전면개정·2024.9.15 공공시스템 특례). 시험 전 개인정보위 공고로 추가 개정 여부를 한 번 더 확인하세요.</p></div>`;
}

// ---------- events ----------
app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.go){ go(b.dataset.go); return; }
  if(b.dataset.start){ startSession(b.dataset.start); return; }
  if(b.dataset.o!==undefined){ answer(+b.dataset.o); return; }
  if(b.dataset.j!==undefined){ session.idx=+b.dataset.j; render(); return; }
  const a=b.dataset.act;
  if(a==='next') next();
  else if(a==='skip'){ if(session.idx<session.items.length-1){session.idx++;render();} else finish(); }
  else if(a==='prev'){ session.idx--; render(); }
  else if(a==='submit'){ const un=session.items.filter(x=>x.ans===null).length; if(un && !b.dataset.sure){ b.dataset.sure='1'; b.textContent=`미응답 ${un}문항 — 그래도 제출`; return; } finish(); }
  else if(a==='mark'){ const it=session.items[session.idx]; it.marked=!it.marked; if(it.marked){ if(!S.marks.includes(it.q.id)) S.marks.push(it.q.id);} else S.marks=S.marks.filter(x=>x!==it.q.id); save(); render(); }
  else if(a==='discard'){ session=null; render(); }
  else if(a==='retryWrong'){ const ws=session.items.filter(it=>it.ans!==it.q.a).map(it=>({q:it.q,order:shuffle([0,1,2,3,4]),ans:null,marked:S.marks.includes(it.q.id)})); session={kind:'wrong',mode:'study',title:'틀린 문제 다시 풀기',items:ws,idx:0,finished:false,start:Date.now(),limit:0,end:0}; go('quiz'); }
  else if(a==='saveDate'){ S.exam=$('#examDate').value; save(); toast('저장했습니다'); }
  else if(a==='copy'){ const t=$('#dump').value; navigator.clipboard.writeText(t).then(()=>toast('복사했습니다')).catch(()=>{ $('#dump').select(); toast('텍스트를 선택했습니다. Ctrl+C로 복사하세요'); }); }
  else if(a==='import'){ try{ const o=JSON.parse($('#imp').value); if(!o.stats) throw 0; S={stats:o.stats||{},history:o.history||[],marks:o.marks||[],exam:o.exam||''}; save(); toast('불러왔습니다'); render(); }catch(err){ toast('형식이 올바르지 않습니다'); } }
  else if(a==='resetAsk'){ if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='정말 삭제할까요? 다시 누르면 삭제'; return; } S={stats:{},history:[],marks:[],exam:S.exam}; session=null; save(); toast('초기화했습니다'); render(); }
});
document.addEventListener('keydown',e=>{
  if(view!=='quiz'||!session) return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(/^[1-5]$/.test(e.key)){ const k=+e.key-1; const it=session.items[session.idx]; answer(it.order[k]); }
  else if(e.key==='Enter'){ const it=session.items[session.idx]; if(session.mode==='mock'||it.ans!==null){ if(session.idx===session.items.length-1 && session.mode==='mock') return; next(); } }
  else if(e.key==='ArrowLeft'&&session.idx>0){ session.idx--; render(); }
});

go('home');
})();
</script></body></html>
