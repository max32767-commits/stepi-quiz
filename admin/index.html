<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>슈퍼관리자 — PIN 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--navy:#373282;--orange:#ED911A;--ink:#1b2230;--muted:#6b7280;--line:#e3e6ef;--bg:#f5f6fb}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",sans-serif;line-height:1.6}
  .wrap{max-width:480px;margin:0 auto;padding:24px 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px}
  h1{margin:0 0 4px;color:var(--navy);font-size:22px} h2{margin:0 0 10px;font-size:16px}
  .muted{color:var(--muted);font-size:14px} label{display:block;font-size:13px;font-weight:700;margin-top:10px}
  input{width:100%;font:inherit;font-size:18px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;margin-top:4px}
  .btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:14px}
  .btn.orange{background:var(--orange)} .btn:disabled{opacity:.45}
  #msg{min-height:1.5em;font-weight:700;margin-top:10px} #msg.ok{color:#1f8a5b} #msg.bad{color:#d6453d}
  .status{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#eef0fa;color:var(--navy)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🛡️ 슈퍼관리자</h1>
    <div class="muted">진행자 PIN을 정하고 바꾸는 곳입니다. 진행자 PIN은 OX 퀴즈·꼬맨틀 진행자 화면에 들어갈 때 쓰고, 슈퍼관리자 PIN은 이 페이지에서만 씁니다.</div>
    <p style="margin:12px 0 0">현재 상태: <span class="status" id="state">확인 중…</span></p>
  </div>

  <div class="card" id="setup" hidden>
    <h2>최초 설정</h2>
    <div class="muted">아직 PIN이 없습니다. 지금 바로 두 PIN을 정해 주세요 (각 4자리 이상). 설정 전에는 누구나 이 화면에서 정할 수 있으니 먼저 설정하세요.</div>
    <label>슈퍼관리자 PIN <input id="s-super" type="password" inputmode="numeric" placeholder="예: 6자리"></label>
    <label>진행자 PIN <input id="s-admin" type="password" inputmode="numeric" placeholder="진행자에게 알려줄 PIN"></label>
    <button class="btn orange" id="s-go">PIN 설정</button>
  </div>

  <div class="card" id="change" hidden>
    <h2>PIN 변경</h2>
    <label>현재 슈퍼관리자 PIN <input id="c-cur" type="password" inputmode="numeric" autocomplete="off"></label>
    <label>새 진행자 PIN <span class="muted">(비우면 유지)</span><input id="c-admin" type="password" inputmode="numeric" autocomplete="off"></label>
    <label>새 슈퍼관리자 PIN <span class="muted">(비우면 유지)</span><input id="c-super" type="password" inputmode="numeric" autocomplete="off"></label>
    <button class="btn" id="c-go">변경</button>
    <div class="muted" style="margin-top:10px">진행자 PIN을 바꾸면 이미 들어와 있는 진행자 화면은 다음 동작부터 새 PIN을 요구합니다.</div>
  </div>
  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../shared/supabase-config.js"></script>
<script src="../shared/supabase-client.js"></script>
<script>
if (!window.sb) throw new Error('Supabase 설정 없음');
const $ = id => document.getElementById(id);
const msg = (t, c) => { $('msg').textContent = t; $('msg').className = c || ''; };
async function refresh() {
  const { data } = await sb.rpc('verify_pin', { p_pin: null });
  const setup = data === 'setup';
  $('state').textContent = setup ? 'PIN 미설정' : 'PIN 설정됨';
  $('setup').hidden = !setup; $('change').hidden = setup;
}
refresh();
$('s-go').onclick = async () => {
  const s = $('s-super').value.trim(), a = $('s-admin').value.trim();
  if (s.length < 4 || a.length < 4) return msg('두 PIN 모두 4자리 이상 입력하세요', 'bad');
  if (s === a) return msg('슈퍼관리자 PIN과 진행자 PIN은 다르게 하세요', 'bad');
  const { error } = await sb.rpc('set_pins', { p_current_super: null, p_new_admin: a, p_new_super: s });
  if (error) return msg(error.message, 'bad');
  msg('설정했습니다. 진행자 PIN을 진행자에게 전달하세요.', 'ok'); refresh();
};
$('c-go').onclick = async () => {
  const cur = $('c-cur').value.trim(), a = $('c-admin').value.trim(), s = $('c-super').value.trim();
  if (!cur) return msg('현재 슈퍼관리자 PIN을 입력하세요', 'bad');
  if (!a && !s) return msg('바꿀 PIN을 하나 이상 입력하세요', 'bad');
  if ((a && a.length < 4) || (s && s.length < 4)) return msg('PIN은 4자리 이상이어야 합니다', 'bad');
  const { error } = await sb.rpc('set_pins', { p_current_super: cur, p_new_admin: a || null, p_new_super: s || null });
  if (error) return msg(error.message.replace(/^.*?: /, ''), 'bad');
  msg('변경했습니다.', 'ok'); ['c-cur', 'c-admin', 'c-super'].forEach(i => $(i).value = '');
};
</script>
<script src="../shared/home.js"></script>
</body>
</html>
